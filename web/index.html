<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Watson's Flowers</title>
<meta name="description" content="A family delivery game: Watson's Flowers, Mesa and Gilbert, Arizona. The TV is the town, every phone is a job.">
<meta property="og:title" content="Watson's Flowers">
<meta property="og:description" content="Deliver the flowers. Mind the goons.">
<meta property="og:image" content="og.png">
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#f2a7b4">
<style>
  html, body { margin: 0; height: 100%; background: #111; overflow: hidden; }
  body { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; color: #fff; user-select: none; cursor: default; }
  canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; }
  #hud { pointer-events: none; }
  #loading { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; font: 600 28px Georgia, serif; color: #f2c531; background: #1b1414; z-index: 5; }
</style>
</head>
<body>
<canvas id="gl"></canvas>
<canvas id="hud"></canvas>
<div id="loading">Opening the shop...</div>
<script src="geo.js"></script>
<script src="map.js"></script>
<script src="sim.js"></script>
<script src="net.js"></script>
<script src="qr.js"></script>
<script type="module">
import * as THREE from './lib/three.module.min.js';
import {buildWorld, makeSign, labelTex, canvas as mkCanvas, tex} from './world.js';

/* Watson's Flowers - the TV.

   Hosts the room, runs the simulation at 60 steps a second, and draws the
   town once for every driver (split screen, up to six vans), the shop's
   numbers across the top, and the lobby, results and parade.

   No phones? Press Enter to open the shop; the arrow keys drive van 1
   (Shift boosts, Space throws), the computer does everything else.
   ?local=1 plus controller.html?local=1#CODE in other tabs: phones
   without the internet. P pauses, M mutes, F fullscreen. */

const PROTO = 1, PROTO_MIN = 1;
const SIM = WSim, DT = SIM.DT;
const ROLES = ['drive', 'toss', 'arrange', 'grow', 'dispatch', 'cart'];
const ROLE_NAMES = {drive: 'Driver', toss: 'Tosser', arrange: 'Arranger', grow: 'Grower', dispatch: 'Dispatcher', cart: 'Rose cart'};
const HOLIDAYS = SIM.HOLIDAYS, HKEYS = SIM.HOLIDAY_KEYS;

/* ---------------- the save ---------------- */
let SAVE = {records: {}, days: 0, holiday: 'thanksgiving'};
try { Object.assign(SAVE, JSON.parse(localStorage.getItem('wats_save') || '{}')); } catch(e){}
function storeSave(){ try { localStorage.setItem('wats_save', JSON.stringify(SAVE)); } catch(e){} }

/* ---------------- the town ---------------- */
const M = WMap.build(WGEO, 1927);
const G = {S: null, phase: 'lobby', paused: false, phaseT: 0, ticker: [], msgs: {}, flash: 0, recordNew: false, kbd: {}};
function newSim(){
  G.S = SIM.create(M, {seed: (Date.now() & 0xffff) + 1, holiday: SAVE.holiday});
}
newSim();

/* ---------------- the room ---------------- */
const NET = {code: null, handle: null, status: 'Opening the room...', people: {}};
function controllerUrl(){
  const base = location.href.split('#')[0].split('?')[0].replace(/[^/]*$/, '');
  return base + 'controller.html' + (WNet.isLocal() ? '?local=1' : '') + '#' + NET.code;
}
function openRoom(){
  NET.status = 'Opening the room...';
  NET.handle = WNet.host({
    open: code => { NET.code = code; NET.status = ''; qrCache = null; },
    conn: c => wireConn(c),
    error: msg => { NET.status = msg + ' Retrying...'; NET.code = null; setTimeout(() => { if(!NET.code) openRoom(); }, 4000); }
  });
}
function wireConn(c){
  let id = null;
  c.on('data', d => {
    if(!d || typeof d !== 'object') return;
    if(d.t === 'hello'){
      id = String(d.dev || c.peer).slice(0, 40);
      const old = NET.people[id];
      if(old && old.conn && old.conn !== c){ try { old.conn.close(); } catch(e){} }
      const p = old || {id, role: null, van: -1, ride: null, inp: {}, seen: 0, joined: performance.now()};
      p.name = cleanName(d.name) || p.name || 'Helper';
      p.conn = c; p.lastConn = c; p.gone = 0; p.seen = performance.now();
      NET.people[id] = p;
      send(p, {t: 'host', proto: PROTO, min: PROTO_MIN});
      tellYou(p);
      ticker(p.name + ' is here');
      return;
    }
    const p = id && NET.people[id];
    if(!p) return;
    if(!p.conn && p.lastConn === c){ p.conn = c; p.gone = 0; seatBack(p); }
    if(p.conn !== c) return;
    p.seen = performance.now();
    onPhone(p, d);
  });
  c.on('close', () => { const p = id && NET.people[id]; if(p && p.conn === c){ p.conn = null; p.gone = performance.now(); away(p); } });
}
function cleanName(n){ return String(n || '').replace(/[^\p{L}\p{N} '\-]/gu, '').trim().slice(0, 14); }
function send(p, m){ if(p && p.conn){ try { p.conn.send(m); } catch(e){} } }
function everyone(m){ Object.values(NET.people).forEach(p => send(p, m)); }
function present(){ return Object.values(NET.people).filter(p => p.conn); }

function sweep(){
  const now = performance.now();
  Object.values(NET.people).forEach(p => {
    if(p.conn && now - p.seen > 6000){ p.conn = null; p.gone = now; away(p); }
    if(!p.conn && now - p.gone > 30000){ release(p); delete NET.people[p.id]; }
  });
  countRoles();
}
/* a driver who goes quiet: the computer takes the wheel until they are back */
function away(p){
  const S = G.S;
  if(p.role === 'drive' && p.van >= 0 && S.vans[p.van] && S.vans[p.van].owner === p.id){ SIM.setOwner(S, p.van, null); S.vans[p.van].name = p.name + ' (computer)'; }
}
function seatBack(p){
  const S = G.S;
  if(p.role === 'drive' && p.van >= 0 && S.vans[p.van] && !S.vans[p.van].owner){ SIM.setOwner(S, p.van, p.id, p.name); }
  tellYou(p);
}
function release(p){
  const S = G.S;
  if(p.role === 'drive' && p.van >= 0 && S.vans[p.van] && (S.vans[p.van].owner === p.id || !S.vans[p.van].owner)){ SIM.setOwner(S, p.van, null); S.vans[p.van].name = 'Computer'; }
}
function countRoles(){
  const S = G.S, r = {arr: 0, grow: 0, disp: 0, cart: 0};
  present().forEach(p => { if(p.role === 'arrange') r.arr++; else if(p.role === 'grow') r.grow++; else if(p.role === 'dispatch') r.disp++; else if(p.role === 'cart') r.cart++; });
  S.roles = r;
}
function drivers(){ return Object.values(NET.people).filter(p => p.role === 'drive').sort((a, b) => a.joined - b.joined); }
function vanFor(p){
  // where a tosser rides: with the driver they picked, else van 1
  const S = G.S;
  if(p.ride){ const d = NET.people[p.ride]; if(d && d.van >= 0 && S.vans[d.van]) return d.van; }
  if(p.rideVan != null && S.vans[p.rideVan]) return p.rideVan;
  return S.vans.length ? 0 : -1;
}
function tellYou(p){
  const S = G.S;
  if(p.role === 'toss') p.van = vanFor(p);
  const drv = drivers().map(d => [d.id, d.name, d.van]);
  const vans = S.vans.map(v => [v.i, v.name, v.color]);
  send(p, {t: 'you', role: p.role, van: p.van, name: p.name, id: p.id, ph: G.phase, drv, vans, hol: SAVE.holiday});
}
function tellAll(){ Object.values(NET.people).forEach(tellYou); }

/* picking a job */
function pick(p, role, opt){
  const S = G.S;
  if(ROLES.indexOf(role) < 0) return;
  // leaving the wheel hands the van to the computer
  if(p.role === 'drive' && role !== 'drive') release(p);
  p.role = role; p.inp = {};
  if(role === 'drive'){
    if(G.phase === 'day' || G.phase === 'count'){
      let v = S.vans.findIndex(q => !q.owner);
      if(v < 0) v = SIM.addVan(S, p.id, p.name);
      if(v < 0){ p.role = null; send(p, {t: 'full'}); tellYou(p); return; }
      SIM.setOwner(S, v, p.id, p.name);
      p.van = v;
      buildVanMesh(v);
    } else {
      if(drivers().length > SIM.MAX_VANS){ p.role = null; send(p, {t: 'full'}); }
      p.van = -1;
    }
  } else if(role === 'toss'){
    p.ride = opt && opt.ride || null;
    p.rideVan = opt && opt.van != null ? +opt.van : null;
    p.van = vanFor(p);
  } else p.van = -1;
  countRoles();
  tellAll();
  sfx('click');
  ticker(p.name + ' is ' + (role === 'arrange' ? 'arranging' : role === 'grow' ? 'in the garden' : role === 'dispatch' ? 'on dispatch' : role === 'cart' ? 'pushing the rose cart' : role === 'toss' ? 'riding shotgun' : 'driving'));
}

function onPhone(p, d){
  const S = G.S;
  switch(d.t){
    case 'pick': pick(p, d.role, d); break;
    case 'name': p.name = cleanName(d.name) || p.name; if(p.role === 'drive' && S.vans[p.van] && S.vans[p.van].owner === p.id){ S.vans[p.van].name = p.name; refreshTag(p.van); } tellAll(); break;
    case 'in': if(p.role === 'drive') p.inp = d; break;
    case 'act': {
      const a = d.a; if(!a || !a.a) return;
      const ok = {
        claim: 'arrange', stem: 'arrange', wrap: 'arrange', ribbon: 'arrange', done: 'arrange', drop: 'arrange',
        water: 'grow', harvest: 'grow', rose: 'cart', assign: 'dispatch', prio: 'dispatch', ping: 'dispatch'
      }[a.a];
      if(a.a === 'toss'){
        if(p.role === 'drive'){ a.v = p.van; a.auto = true; }
        else if(p.role === 'toss'){ a.v = p.van = vanFor(p); a.auto = false; }
        else return;
      } else if(a.a === 'ptoss'){ /* everybody throws at the parade */ }
      else if(ok && ok !== p.role) return;
      SIM.act(S, p.id, p.name, a);
      break;
    }
    case 'start':
      if(G.phase === 'lobby'){ if(d.hol && HOLIDAYS[d.hol]) SAVE.holiday = d.hol; startDay(); }
      break;
    case 'hol':
      if(G.phase === 'lobby' && HOLIDAYS[d.k]){ SAVE.holiday = d.k; storeSave(); G.S.holiday = d.k; tellAll(); sfx('click'); }
      break;
    case 'next':
      if(G.phase === 'end' && G.phaseT > 3) startParade();
      else if(G.phase === 'results' && G.phaseT > 2) toLobby();
      break;
    case 'pause':
      if(G.phase === 'day'){ G.paused = !!d.v; G.S.paused = G.paused; sfx('click'); }
      break;
  }
}

/* what every phone is told, ten times a second */
function broadcast(){
  const S = G.S;
  const s = SIM.snap(S);
  s.t = 's'; s.phase = G.phase; s.paused = G.paused;
  s.ppl = Object.values(NET.people).map(p => [p.name, p.role || '', p.van, p.conn ? 1 : 0, p.id]);
  s.rec = SAVE.records[SAVE.holiday] || 0;
  if(G.phase === 'end' || G.phase === 'results') s.res = S.results ? {money: S.money, del: S.results.delivered, aw: S.results.awards, cheers: S.cheers} : null;
  everyone(s);
  // the van's own numbers for its driver and tossers
  Object.values(NET.people).forEach(p => {
    if((p.role === 'drive' || p.role === 'toss') && p.van >= 0 && S.vans[p.van]){
      const vi = SIM.vanInfo(S, p.van);
      vi.t = 'v'; vi.i = p.van;
      send(p, vi);
    }
  });
}

/* ---------------- the day ---------------- */
function startDay(){
  const S = G.S = SIM.create(M, {seed: (Date.now() & 0xffff) + 1, holiday: SAVE.holiday});
  drivers().slice(0, SIM.MAX_VANS).forEach(p => {
    const v = SIM.addVan(S, p.conn ? p.id : null, p.name);
    p.van = v;
  });
  if(!S.vans.length) SIM.addVan(S, null, 'Computer');
  if(G.kbdDriver && !S.vans[0].owner){ SIM.setOwner(S, 0, 'kbd', 'Keyboard'); }
  countRoles();
  SIM.start(S, SAVE.holiday);
  G.phase = 'count'; G.phaseT = 0; G.paused = false; G.recordNew = false;
  rebuildVans();
  clearFx();
  tellAll();
  musicMode('day');
}
function endOfDay(){
  G.phase = 'end'; G.phaseT = 0;
  const S = G.S;
  const best = SAVE.records[S.holiday] || 0;
  if(S.money > best){ SAVE.records[S.holiday] = S.money; G.recordNew = true; }
  SAVE.days++;
  storeSave();
  tellAll();
  musicMode('results');
  cue('end');
}
function startParade(){
  SIM.startParade(G.S);
  G.phase = 'parade'; G.phaseT = 0;
  buildParade();
  tellAll();
  musicMode('parade');
}
function toLobby(){
  G.phase = 'lobby'; G.phaseT = 0;
  if(parade){ scene.remove(parade.grp); scene.remove(parade.crowd); parade = null; }
  newSim();
  Object.values(NET.people).forEach(p => { if(p.role === 'drive') p.van = -1; });
  rebuildVans();
  clearFx();
  tellAll();
  musicMode('lobby');
}

/* ---------------- the clock ---------------- */
let lastT = performance.now(), acc = 0, simTime = 0;
function tick(){
  const now = performance.now();
  acc += Math.min(0.25, (now - lastT) / 1000);
  lastT = now;
  while(acc >= DT){
    acc -= DT;
    stepOnce();
  }
}
function stepOnce(){
  const S = G.S;
  G.phaseT += DT;
  // inputs: phones and the keyboard
  if(G.phase === 'day' || G.phase === 'count'){
    Object.values(NET.people).forEach(p => {
      if(p.role === 'drive' && p.van >= 0 && S.vans[p.van] && S.vans[p.van].owner === p.id) SIM.input(S, p.van, p.inp);
    });
    if(S.vans[0] && S.vans[0].owner === 'kbd') SIM.input(S, 0, kbdInput());
  }
  // remember where everything was, for smooth drawing
  S.vans.forEach(v => { v.px = v.x; v.pz = v.z; v.py = v.y; v.ph = v.h; });
  SIM.step(S);
  simTime += DT;
  S.ev.forEach(onEvent);
  if(G.phase === 'count' && S.ph === 'day'){ G.phase = 'day'; G.phaseT = 0; }
  if(G.phase === 'day' && S.ph === 'end') endOfDay();
  if(G.phase === 'parade' && S.ph === 'results'){ G.phase = 'results'; G.phaseT = 0; tellAll(); cue('cheer'); }
  if(G.phase === 'end' && G.phaseT > 14) startParade();
  if(G.phase === 'results' && G.phaseT > 60) toLobby();
}

/* ---------------- keyboard ---------------- */
let kbSteer = 0;
function kbdInput(){
  const k = G.kbd;
  const want = (k.ArrowRight || k.KeyD ? 1 : 0) - (k.ArrowLeft || k.KeyA ? 1 : 0);
  kbSteer += Math.max(-DT * 5, Math.min(DT * 5, want - kbSteer));
  if(!want && Math.abs(kbSteer) < 0.05) kbSteer = 0;
  return {st: kbSteer, gas: k.ArrowUp || k.KeyW, brk: k.ArrowDown || k.KeyS, bst: k.ShiftLeft || k.ShiftRight};
}
addEventListener('keydown', e => {
  G.kbd[e.code] = true;
  soundOn();
  if(['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'KeyW', 'KeyA', 'KeyS', 'KeyD'].includes(e.code)){
    e.preventDefault();
    G.kbdDriver = true;
    const S = G.S;
    if(S.vans[0] && !S.vans[0].owner && (G.phase === 'day' || G.phase === 'count')){ SIM.setOwner(S, 0, 'kbd', 'Keyboard'); refreshTag(0); }
  }
  if(e.repeat) return;
  if(e.code === 'Enter'){
    if(G.phase === 'lobby') startDay();
    else if(G.phase === 'end') startParade();
    else if(G.phase === 'results') toLobby();
  }
  if(e.code === 'Space'){
    e.preventDefault();
    if(G.phase === 'day' && G.S.vans[0]) SIM.act(G.S, 'kbd', 'Keyboard', {a: 'toss', v: 0, ang: 0, pow: 0.5, auto: true});
    if(G.phase === 'parade') SIM.act(G.S, 'kbd', 'Keyboard', {a: 'ptoss', ang: Math.random() < 0.5 ? Math.PI / 2 : -Math.PI / 2, pow: 0.5});
  }
  if(e.code === 'KeyP' && G.phase === 'day'){ G.paused = !G.paused; G.S.paused = G.paused; }
  if(e.code === 'KeyM') toggleMute();
  if(e.code === 'KeyF'){ if(document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen().catch(() => {}); }
  if(e.code === 'KeyH' && G.phase === 'lobby'){ const i = (HKEYS.indexOf(SAVE.holiday) + 1) % HKEYS.length; SAVE.holiday = HKEYS[i]; G.S.holiday = SAVE.holiday; storeSave(); tellAll(); }
});
addEventListener('keyup', e => { G.kbd[e.code] = false; });
addEventListener('blur', () => { G.kbd = {}; });
addEventListener('pointerdown', () => soundOn());

/* ---------------- three.js ---------------- */
const glc = document.getElementById('gl');
const renderer = new THREE.WebGLRenderer({canvas: glc, antialias: true, powerPreference: 'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.autoClear = false;
const scene = new THREE.Scene();
const world = buildWorld(scene, M);
const hud = document.getElementById('hud'), H = hud.getContext('2d');
let VW = 0, VH = 0, DPR = 1;
function resize(){
  DPR = Math.min(devicePixelRatio, 1.5);
  VW = innerWidth; VH = innerHeight;
  renderer.setSize(VW, VH, false);
  hud.width = Math.round(VW * DPR); hud.height = Math.round(VH * DPR);
}
addEventListener('resize', resize);
resize();

/* ---------------- vans ---------------- */
function liveryTex(color){
  const c = mkCanvas(512, 256), g = c.getContext('2d');
  g.fillStyle = '#fbfbf7'; g.fillRect(0, 0, 512, 256);
  g.fillStyle = '#f2a7b4'; g.fillRect(0, 150, 512, 60);
  g.fillStyle = color; g.fillRect(0, 210, 512, 14);
  g.fillStyle = '#1b1b1b'; g.beginPath(); g.ellipse(170, 80, 128, 58, 0, 0, Math.PI * 2); g.fill();
  g.fillStyle = '#f6f3ea'; g.beginPath(); g.ellipse(170, 80, 120, 50, 0, 0, Math.PI * 2); g.fill();
  g.fillStyle = '#151515'; g.font = 'italic bold 66px "Brush Script MT", "Segoe Script", cursive'; g.textAlign = 'center'; g.textBaseline = 'middle';
  g.fillText("Watson's", 170, 86);
  g.font = 'bold 50px "Arial Black", Impact, sans-serif'; g.lineWidth = 6; g.strokeStyle = '#7a4a10'; g.strokeText('FLOWERS', 256, 181); g.fillStyle = '#f2c531'; g.fillText('FLOWERS', 256, 181);
  // a blossom
  g.save(); g.translate(400, 74);
  for(let i = 0; i < 5; i++){ g.rotate(Math.PI * 2 / 5); g.fillStyle = '#f7cfd6'; g.beginPath(); g.ellipse(0, -24, 16, 24, 0, 0, Math.PI * 2); g.fill(); }
  g.fillStyle = '#f2c531'; g.beginPath(); g.arc(0, 0, 10, 0, Math.PI * 2); g.fill(); g.restore();
  g.fillStyle = '#555'; g.font = 'bold 18px Georgia'; g.fillText('The Best Since 1927', 400, 128);
  return tex(c);
}
function frontTex(){
  const c = mkCanvas(256, 256), g = c.getContext('2d');
  g.fillStyle = '#fbfbf7'; g.fillRect(0, 0, 256, 256);
  g.fillStyle = '#26323d'; g.fillRect(14, 20, 228, 100);
  g.fillStyle = '#ddd'; g.fillRect(40, 170, 176, 30);
  g.fillStyle = '#fff6c8'; g.fillRect(8, 160, 40, 26); g.fillRect(208, 160, 40, 26);
  return tex(c);
}
function backTex(color){
  const c = mkCanvas(256, 256), g = c.getContext('2d');
  g.fillStyle = '#fbfbf7'; g.fillRect(0, 0, 256, 256);
  g.fillStyle = '#26323d'; g.fillRect(30, 30, 80, 60); g.fillRect(146, 30, 80, 60);
  g.fillStyle = '#999'; g.fillRect(126, 20, 4, 220);
  g.fillStyle = '#d0202a'; g.fillRect(8, 150, 26, 40); g.fillRect(222, 150, 26, 40);
  g.fillStyle = color; g.font = 'bold 30px Georgia'; g.textAlign = 'center'; g.fillText('Fragile!', 128, 220);
  g.fillStyle = '#333'; g.font = 'bold 18px Georgia'; g.fillText('How am I driving?', 128, 130);
  return tex(c);
}
const FRONT = frontTex();
const vanObjs = [];
const wheelGeo = new THREE.CylinderGeometry(0.42, 0.42, 0.3, 14).rotateX(Math.PI / 2);
const wheelMat = new THREE.MeshLambertMaterial({color: '#1c1c1c'});
function buildVanMesh(i){
  const S = G.S, v = S.vans[i];
  if(!v) return;
  if(vanObjs[i]){ scene.remove(vanObjs[i].grp); }
  const grp = new THREE.Group();
  const body = new THREE.Group(); grp.add(body);
  const liv = liveryTex(v.color);
  const white = new THREE.MeshLambertMaterial({color: '#fbfbf7'});
  const mats = [new THREE.MeshLambertMaterial({map: FRONT}), new THREE.MeshLambertMaterial({map: backTex(v.color)}), white, new THREE.MeshLambertMaterial({color: '#333'}),
                new THREE.MeshLambertMaterial({map: liv}), new THREE.MeshLambertMaterial({map: liv})];
  const box = new THREE.Mesh(new THREE.BoxGeometry(4.4, 2.3, 2.15), mats);
  box.position.set(-0.55, 1.6, 0); body.add(box);
  const hood = new THREE.Mesh(new THREE.BoxGeometry(1.1, 1.0, 2.05), [white, white, white, white, white, white]);
  hood.position.set(2.2, 0.95, 0); body.add(hood);
  const glass = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.9, 1.9), new THREE.MeshLambertMaterial({color: '#26323d'}));
  glass.position.set(1.66, 1.95, 0); glass.rotation.z = -0.35; body.add(glass);
  const stripe = new THREE.Mesh(new THREE.BoxGeometry(5.6, 0.12, 2.18), new THREE.MeshLambertMaterial({color: v.color}));
  stripe.position.set(0, 0.5, 0); body.add(stripe);
  const wheels = [];
  [[1.85, 1.05], [1.85, -1.05], [-1.9, 1.05], [-1.9, -1.05]].forEach(([x, z]) => {
    const w = new THREE.Mesh(wheelGeo, wheelMat); w.position.set(x, 0.42, z); body.add(w); wheels.push(w);
  });
  // boost flames
  const flame = new THREE.Mesh(new THREE.ConeGeometry(0.35, 2.2, 10).rotateZ(Math.PI / 2), new THREE.MeshBasicMaterial({color: '#7fd0ff', transparent: true, opacity: 0.85}));
  flame.position.set(-3.6, 0.7, 0.6); body.add(flame);

function carGeo(kind){

    if(p.y > 0.05){

      const drag = Math.exp(-1.6 * dt);

      p.rx += p.wx * dt; p.ry += p.wy * dt;
      if(p.y <= 0.05){ p.y = 0.05; p.rx = Math.PI / 2; }
    }
  }
  for(let i = 0; i < P.length; i++){
    const p = P[i];

    _e.set(p.rx, p.ry, 0); _q.setFromEuler(_e); _p.set(p.x, p.y, p.z); _s.set(s, s, s);

  for(let z = Pd.z0 - 10; z < Pd.z0 + Pd.speed * Pd.dur + 40; z += 1.6) [-1, 1].forEach(sd => {

  });

function drawParade(dt, t){

/* ---------------- layout ---------------- */
function layout(n){
  const W = VW, Hh = VH, top = 46;
  const h = Hh - top;
  if(n <= 1) return {views: [[0, top, W, h]], map: [W - 300, Hh - 230, 280, 210]};
  if(n === 2) return {views: [[0, top, W / 2, h], [W / 2, top, W / 2, h]], map: [W / 2 - 140, Hh - 200, 280, 190]};
  if(n === 3) return {views: [[0, top, W / 2, h / 2], [W / 2, top, W / 2, h / 2], [0, top + h / 2, W / 2, h / 2]], map: [W / 2 + 10, top + h / 2 + 10, W / 2 - 20, h / 2 - 20], big: true};
  if(n === 4) return {views: [[0, top, W / 2, h / 2], [W / 2, top, W / 2, h / 2], [0, top + h / 2, W / 2, h / 2], [W / 2, top + h / 2, W / 2, h / 2]], map: [W / 2 - 110, top + h / 2 - 80, 220, 160]};
  const w3 = W / 3;
  const v = [[0, top, w3, h / 2], [w3, top, w3, h / 2], [2 * w3, top, w3, h / 2], [0, top + h / 2, w3, h / 2], [w3, top + h / 2, w3, h / 2], [2 * w3, top + h / 2, w3, h / 2]].slice(0, n);
  return {views: v, map: n === 5 ? [2 * w3 + 10, top + h / 2 + 10, w3 - 20, h / 2 - 20] : [W / 2 - 100, top + h / 2 - 75, 200, 150], big: n === 5};
}

/* ---------------- drawing ---------------- */
const overview = new THREE.PerspectiveCamera(50, 1, 1, 6000);
let frameT = performance.now(), wallT = 0;
function frame(){
  requestAnimationFrame(frame);
  const now = performance.now(), dt = Math.min(0.1, (now - frameT) / 1000);
  frameT = now; wallT += dt;
  const S = G.S;
  const alpha = Math.max(0, Math.min(1, acc / DT));
  const hour = G.phase === 'lobby' ? 19.2 : G.phase === 'parade' || G.phase === 'results' ? 19.6 : G.phase === 'end' ? 20 : S.clock;
  const dust = G.phase === 'day' || G.phase === 'end' ? S.dust : 0;
  const wind = {x: S.gust.x * dust * 2, z: S.gust.z * dust * 2};

  drawTraffic(S);
  drawGoons(S, wallT);
  drawFlying(dt);
  drawPetals(dt, wind);
  drawSmoke(dt);
  drawBooms(dt);
  drawPings(S, wallT);
  drawParade(dt, wallT);
  world.updateLights(S);
  world.updatePickups(S, wallT);
  // props come back after a minute
  if(Math.random() < 0.05) Object.keys(brokenShown).forEach(id => { if(!S.broken[id]){ world.setProp(+id, true); delete brokenShown[id]; } });
  if(world.water) world.water.position.y = Math.sin(wallT * 0.8) * 0.05;

  // vans
  S.vans.forEach((v, i) => {
    const o = vanObjs[i] || (buildVanMesh(i), vanObjs[i]);
    if(!o) return;
    if(o.tagName !== v.name) refreshTag(i);
    const x = v.px != null ? v.px + (v.x - v.px) * alpha : v.x, z = v.pz != null ? v.pz + (v.z - v.pz) * alpha : v.z;
    const y = v.py != null ? v.py + (v.y - v.py) * alpha : v.y;
    let h = v.h; if(v.ph != null){ let d = v.h - v.ph; d = Math.atan2(Math.sin(d), Math.cos(d)); h = v.ph + d * alpha; }
    o.grp.position.set(x, y, z);
    if(v.crash){ o.grp.rotation.set(v.crash.ax, -v.crash.h + v.crash.ay, v.crash.az, 'YXZ'); }
    else {
      // lean into turns and pitch with the slope
      const lean = -v.yaw * Math.min(1, v.spd / 30) * 0.06 * (v.drift ? 2 : 1);
      const pitch = v.air > 0.2 ? Math.max(-0.4, Math.min(0.3, v.vy * 0.03)) : 0;
      o.grp.rotation.set(lean, -h, pitch, 'YXZ');
    }
    o.wheels.forEach(w => { w.rotation.z -= v.spd * dt / 0.42; });
    const fl = v.boosting && !v.crash;
    o.flame.visible = o.flame2.visible = fl;
    if(fl){ const s = 0.8 + Math.random() * 0.5; o.flame.scale.set(s, 1, 1); o.flame2.scale.set(s, 1, 1); o.flame.material.color.set(v.powder > 0 ? '#ff8a2a' : '#7fd0ff'); }
    o.body.visible = !(v.ghost > 0 && !v.crash && Math.floor(wallT * 12) % 2 === 0 && G.phase === 'day');
    o.shadow.position.set(x, M.height(x, z) + 0.07, z); o.shadow.rotation.y = -h; o.shadow.material.opacity = Math.max(0.05, 0.35 - (y - M.height(x, z)) * 0.04);
    // tyre smoke while drifting, dust off-road
    if(v.drift && v.spd > 12 && Math.random() < 0.6) puff(x - Math.cos(h) * 2.2, 0.4, z - Math.sin(h) * 2.2, 1, '#e6e1d8', 0.8, 0.8);
    if(v.powder > 0 && Math.random() < 0.5) puff(x - Math.cos(h) * 3, 1, z - Math.sin(h) * 3, 1, '#444', 0.9, 1.5);
    // the porch beam
    const tp = SIM.targetPoint(S, v);
    o.mark.visible = !!tp && (G.phase === 'day');
    if(tp){ o.mark.position.set(tp.x, 0, tp.z); o.mark.children[1].scale.setScalar(1 + 0.15 * Math.sin(wallT * 6)); }
    routeRibbon(o, v);
    o.ribbon.visible = G.phase === 'day' && !!v.route;
  });

  // render
  renderer.setScissorTest(false);
  renderer.setViewport(0, 0, VW, VH);
  renderer.clear();
  H.setTransform(DPR, 0, 0, DPR, 0, 0);
  H.clearRect(0, 0, VW, VH);

  if(G.phase === 'day' || G.phase === 'count' || G.phase === 'end'){
    const L = layout(S.vans.length);
    S.vans.forEach((v, i) => {
      const r = L.views[i]; if(!r) return;
      const cam = chaseCam(v, vanObjs[i], dt, r[2] / r[3]);
      world.update(hour, dust, wallT, cam.position);
      renderer.setScissorTest(true);
      renderer.setScissor(r[0], VH - r[1] - r[3], r[2], r[3]);
      renderer.setViewport(r[0], VH - r[1] - r[3], r[2], r[3]);
      if(vanObjs[i]) vanObjs[i].tag.visible = false;
      renderer.render(scene, cam);
      if(vanObjs[i]) vanObjs[i].tag.visible = true;
    });
    renderer.setScissorTest(false);
    S.vans.forEach((v, i) => { const r = L.views[i]; if(r) drawVanHud(v, i, r); });
    drawMinimap(L.map, L.big);
    drawTopBar();
    drawTicker();
    if(G.phase === 'count') drawCountdown();
    if(G.phase === 'end') drawResults(false);
    if(G.paused) drawCenter('PAUSED', 'P or the pause button to carry on');
  } else if(G.phase === 'parade' || G.phase === 'results'){
    const cam = parade ? parade.cam : overview;
    const Pd = S.parade;
    if(Pd){
      cam.aspect = VW / VH; cam.updateProjectionMatrix();
      const a = wallT * 0.15;
      cam.position.set(Pd.x + 20 * Math.cos(a), 9, Pd.z + 22 + 6 * Math.sin(a));
      cam.lookAt(Pd.x, 2.5, Pd.z - 2);
    }
    world.update(hour, 0, wallT, cam.position);
    renderer.render(scene, cam);
    if(G.phase === 'parade') drawParadeHud(); else drawResults(true);
    drawTicker();
  } else {
    // the lobby: around the sign at sunset
    const sg = M.watsonsSign;
    overview.aspect = VW / VH; overview.updateProjectionMatrix();
    const a = wallT * 0.08;
    overview.position.set(sg.x + Math.cos(a) * 34, 7 + Math.sin(wallT * 0.2) * 2, sg.z - 20 + Math.sin(a) * 30);
    overview.lookAt(sg.x, 8.5, sg.z);
    world.update(hour, 0, wallT, overview.position);
    renderer.render(scene, overview);
    drawLobby();
  }
  if(document.getElementById('loading')) document.getElementById('loading').remove();
}

const _v3 = new THREE.Vector3();
function chaseCam(v, o, dt, aspect){
  const cam = o.cam;
  const k = 1 - Math.exp(-dt * 7);
  if(v.crash){
    // the crash camera: swing slowly round the wreck
    o.orbit += dt * 0.6;
    const c = v.crash, a = -c.h + Math.PI * 0.75 + o.orbit;
    _v3.set(c.x + Math.cos(a) * 11, c.y + 4.5, c.z + Math.sin(a) * 11);
    cam.position.lerp(_v3, 1 - Math.exp(-dt * 4));
    cam.lookAt(c.x, c.y + 1, c.z);
    o.fov += (58 - o.fov) * k;
  } else {
    // follow the direction of travel more than the nose, so a drift shows
    const sp = v.spd;
    let want = v.h;
    if(sp > 6){ const mv = Math.atan2(v.vz, v.vx); let d = mv - v.h; d = Math.atan2(Math.sin(d), Math.cos(d)); want = v.h + d * 0.55; }
    let dy = want - o.camYaw; dy = Math.atan2(Math.sin(dy), Math.cos(dy));
    o.camYaw += dy * (1 - Math.exp(-dt * 6));
    const back = 8.5 + Math.min(4, sp * 0.06), up = 3.4 + (v.air > 0.3 ? 2 : 0);
    _v3.set(o.grp.position.x - Math.cos(o.camYaw) * back, o.grp.position.y + up, o.grp.position.z - Math.sin(o.camYaw) * back);
    cam.position.lerp(_v3, 1 - Math.exp(-dt * 10));
    const gy = M.height(cam.position.x, cam.position.z) + 1.2; if(cam.position.y < gy) cam.position.y = gy;
    cam.lookAt(o.grp.position.x + Math.cos(o.camYaw) * 6, o.grp.position.y + 1.6, o.grp.position.z + Math.sin(o.camYaw) * 6);
    const wantFov = 66 + Math.min(18, sp * 0.28) + (v.boosting ? 8 : 0);
    o.fov += (wantFov - o.fov) * k;
    if(v.boosting) o.shake = Math.max(o.shake, 0.18);
  }
  if(o.shake > 0){ cam.position.x += (Math.random() - 0.5) * o.shake * 0.6; cam.position.y += (Math.random() - 0.5) * o.shake * 0.5; o.shake = Math.max(0, o.shake - dt * 2.5); }
  cam.fov = o.fov; cam.aspect = aspect; cam.updateProjectionMatrix();
  return cam;
}

/* ---------------- the HUD ---------------- */
function roundRect(g, x, y, w, h, r){ g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r); g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath(); }
function panel(x, y, w, h, a){ H.fillStyle = 'rgba(15,10,12,' + (a == null ? 0.55 : a) + ')'; roundRect(H, x, y, w, h, 10); H.fill(); }
function txt(s, x, y, size, color, align, weight){ H.font = (weight || 'bold') + ' ' + size + 'px system-ui, -apple-system, Segoe UI, sans-serif'; H.fillStyle = color || '#fff'; H.textAlign = align || 'left'; H.textBaseline = 'middle'; H.fillText(s, x, y); }
function outlined(s, x, y, size, color, align){ H.font = '900 ' + size + 'px system-ui, -apple-system, Segoe UI, sans-serif'; H.textAlign = align || 'center'; H.textBaseline = 'middle'; H.lineWidth = Math.max(3, size / 8); H.strokeStyle = 'rgba(0,0,0,0.75)'; H.strokeText(s, x, y); H.fillStyle = color || '#fff'; H.fillText(s, x, y); }

function clock12(h){ const hh = Math.floor(h), mm = Math.floor((h - hh) * 60 / 5) * 5; const ap = hh >= 12 ? 'PM' : 'AM'; return ((hh + 11) % 12 + 1) + ':' + String(mm).padStart(2, '0') + ' ' + ap; }
function drawTopBar(){

  H.fillStyle = '#f2a7b4'; H.fillRect(0, 43, W, 3);

/* ---------------- sound ---------------- */
let AC = null, master = null, muted = false, musicGain = null, engines = [];
function soundOn(){
  if(AC){ if(AC.state === 'suspended') AC.resume(); return; }
  try {
    if(navigator.audioSession) navigator.audioSession.type = 'playback';
    AC = new (window.AudioContext || window.webkitAudioContext)();
    master = AC.createGain(); master.gain.value = muted ? 0 : 0.6; master.connect(AC.destination);
    musicGain = AC.createGain(); musicGain.gain.value = 0.22; musicGain.connect(master);
    noiseBuf = AC.createBuffer(1, AC.sampleRate, AC.sampleRate);
    const d = noiseBuf.getChannelData(0); for(let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    startMusic();
  } catch(e){ AC = null; }
}
function toggleMute(){ muted = !muted; if(master) master.gain.value = muted ? 0 : 0.6; }
let noiseBuf = null;
function tone(f, d, type, vol, t0, slide){
  if(!AC) return;
  const t = AC.currentTime + (t0 || 0);
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type || 'sine'; o.frequency.setValueAtTime(f, t);
  if(slide) o.frequency.exponentialRampToValueAtTime(slide, t + d);
  g.gain.setValueAtTime(vol || 0.2, t); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
  o.connect(g); g.connect(master); o.start(t); o.stop(t + d + 0.05);
}
function noise(d, f, q, vol, t0, type, f2){
  if(!AC) return;
  const t = AC.currentTime + (t0 || 0);
  const s = AC.createBufferSource(); s.buffer = noiseBuf; s.loop = true;
  const fl = AC.createBiquadFilter(); fl.type = type || 'bandpass'; fl.frequency.setValueAtTime(f, t); fl.Q.value = q || 1;
  if(f2) fl.frequency.exponentialRampToValueAtTime(f2, t + d);
  const g = AC.createGain(); g.gain.setValueAtTime(vol || 0.3, t); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
  s.connect(fl); fl.connect(g); g.connect(master); s.start(t, Math.random()); s.stop(t + d + 0.05);
}
const sfxLast = {};
function sfx(k, v){
  if(!AC) return;
  const now = AC.currentTime;
  if(sfxLast[k] && now - sfxLast[k] < 0.05) return;
  sfxLast[k] = now;
  switch(k){
    case 'click': tone(880, 0.06, 'square', 0.06); break;
    case 'crash': noise(0.9, 900, 0.6, 0.7, 0, 'lowpass', 120); tone(70, 0.5, 'sine', 0.6, 0, 35); for(let i = 0; i < 6; i++) tone(1200 + Math.random() * 2400, 0.15, 'triangle', 0.08, 0.05 + Math.random() * 0.5); break;
    case 'thud': tone(90, 0.2, 'sine', 0.3, 0, 50); noise(0.15, 400, 1, 0.15); break;
    case 'bump': noise(0.12, 600, 1, Math.min(0.3, (v || 5) / 30)); break;
    case 'smash': noise(0.18, 1800, 1.5, 0.18); tone(300 + Math.random() * 300, 0.1, 'triangle', 0.08); break;
    case 'whoosh': noise(0.4, 400, 2, 0.25, 0, 'bandpass', 2400); break;
    case 'toss': noise(0.3, 600, 3, 0.15, 0, 'bandpass', 1800); break;
    case 'perfect': [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.25, 'triangle', 0.18, i * 0.07)); tone(2093, 0.4, 'sine', 0.08, 0.3); break;
    case 'porch': [523, 784].forEach((f, i) => tone(f, 0.22, 'triangle', 0.16, i * 0.08)); break;
    case 'lawn': tone(440, 0.25, 'triangle', 0.14); break;
    case 'miss': tone(330, 0.3, 'sawtooth', 0.1, 0, 300); tone(262, 0.5, 'sawtooth', 0.1, 0.3, 220); break;
    case 'load': [660, 880].forEach((f, i) => tone(f, 0.12, 'sine', 0.12, i * 0.06)); break;
    case 'mist': noise(0.8, 5000, 0.5, 0.08, 0, 'highpass'); break;
    case 'fuse': noise(1.2, 3000, 2, 0.12, 0, 'bandpass', 5000); break;
    case 'boom': tone(55, 1.2, 'sine', 0.8, 0, 28); noise(1.4, 500, 0.5, 0.8, 0, 'lowpass', 80); break;
    case 'splash': noise(0.9, 1200, 0.6, 0.5, 0, 'lowpass', 300); break;
    case 'goon': tone(600, 0.15, 'square', 0.08, 0, 900); tone(500, 0.3, 'square', 0.08, 0.15, 200); break;
    case 'bonk': tone(220, 0.15, 'square', 0.15, 0, 110); noise(0.1, 2000, 2, 0.15); break;
    case 'bell': [988, 1319].forEach((f, i) => tone(f, 0.5, 'sine', 0.12, i * 0.12)); break;
    case 'ding': tone(1568, 0.3, 'sine', 0.08); break;
    case 'cash': tone(2637, 0.08, 'square', 0.06); tone(3136, 0.25, 'sine', 0.08, 0.08); break;
    case 'rose': tone(1760, 0.15, 'sine', 0.05); break;
    case 'ping': tone(1200, 0.1, 'sine', 0.12); tone(1200, 0.1, 'sine', 0.12, 0.15); break;
    case 'cheer': for(let i = 0; i < 4; i++) noise(0.6, 1500 + Math.random() * 1500, 1, 0.08, i * 0.08); break;
  }
}
function cue(k){
  if(!AC) return;
  if(k === 'count') tone(660, 0.18, 'square', 0.12);
  if(k === 'go'){ tone(880, 0.5, 'square', 0.14); tone(1320, 0.5, 'square', 0.08); }
  if(k === 'goons'){ [392, 370, 349, 330].forEach((f, i) => tone(f, 0.2, 'sawtooth', 0.08, i * 0.15)); }
  if(k === 'haboob') noise(3, 200, 0.5, 0.3, 0, 'lowpass', 600);
  if(k === 'end') [523, 659, 784, 1047, 784, 1047].forEach((f, i) => tone(f, 0.3, 'triangle', 0.14, i * 0.14));
  if(k === 'cheer') sfx('cheer');
}
/* engines: one hum per van, panned to its screen */
function engineTick(){
  if(!AC) return;
  const S = G.S, L = layout(S.vans.length);
  S.vans.forEach((v, i) => {
    let e = engines[i];
    if(!e){
      const o = AC.createOscillator(), o2 = AC.createOscillator(), f = AC.createBiquadFilter(), g = AC.createGain(), p = AC.createStereoPanner ? AC.createStereoPanner() : null;
      o.type = 'sawtooth'; o2.type = 'square'; o2.detune.value = 7 + i * 3; f.type = 'lowpass'; f.frequency.value = 600; g.gain.value = 0;
      o.connect(f); o2.connect(f); f.connect(g); if(p){ g.connect(p); p.connect(master); } else g.connect(master);
      o.start(); o2.start();
      const sq = AC.createBufferSource(); sq.buffer = noiseBuf; sq.loop = true;
      const sf = AC.createBiquadFilter(); sf.type = 'bandpass'; sf.frequency.value = 1400; sf.Q.value = 6;
      const sg = AC.createGain(); sg.gain.value = 0;
      sq.connect(sf); sf.connect(sg); sg.connect(p || master); sq.start();
      e = engines[i] = {o, o2, f, g, p, sg};
    }
    const on = (G.phase === 'day' || G.phase === 'count') && !v.crash;
    const t = AC.currentTime;
    const base = 38 + v.spd * 2.4 + (v.boosting ? 35 : 0);
    e.o.frequency.setTargetAtTime(base, t, 0.05); e.o2.frequency.setTargetAtTime(base * 0.5, t, 0.05);
    e.f.frequency.setTargetAtTime(400 + v.spd * 30 + (v.gas ? 500 : 0), t, 0.05);
    e.g.gain.setTargetAtTime(on ? (0.035 + (v.gas ? 0.03 : 0) + (v.boosting ? 0.03 : 0)) / Math.sqrt(S.vans.length) : 0, t, 0.08);
    e.sg.gain.setTargetAtTime(on && v.drift && v.spd > 12 ? 0.06 : 0, t, 0.05);
    const r = L.views[i];
    if(e.p && r) e.p.pan.setTargetAtTime(((r[0] + r[2] / 2) / VW - 0.5) * 1.4, t, 0.1);
  });
  for(let i = S.vans.length; i < engines.length; i++) if(engines[i]) engines[i].g.gain.setTargetAtTime(0, AC.currentTime, 0.1);
}

/* music: a little sequenced loop - a walking bass, a brushed beat and a
   twangy tune, written out here rather than recorded */
let musicState = 'lobby', musicStep = 0, musicNext = 0;
const SONGS = {
  lobby: {bpm: 96, bass: [45, 0, 52, 0, 50, 0, 52, 0, 43, 0, 50, 0, 48, 0, 50, 0], lead: [69, 0, 0, 72, 0, 74, 72, 0, 67, 0, 0, 0, 69, 0, 67, 64]},
  day: {bpm: 132, bass: [40, 40, 47, 40, 45, 45, 52, 45, 43, 43, 50, 43, 47, 47, 54, 47], lead: [64, 0, 67, 69, 0, 71, 69, 67, 64, 0, 62, 64, 0, 0, 59, 0]},
  parade: {bpm: 116, bass: [48, 0, 55, 0, 53, 0, 55, 0, 48, 0, 52, 0, 55, 0, 52, 0], lead: [72, 74, 76, 0, 79, 0, 76, 74, 72, 0, 69, 0, 72, 0, 0, 0]},
  results: {bpm: 100, bass: [48, 0, 52, 0, 55, 0, 52, 0, 53, 0, 57, 0, 55, 0, 52, 0], lead: [76, 0, 74, 0, 72, 0, 74, 76, 0, 79, 0, 76, 74, 0, 72, 0]}
};
function startMusic(){ musicNext = AC.currentTime + 0.1; }
function musicMode(m){ musicState = m; musicStep = 0; }
function mtof(n){ return 440 * Math.pow(2, (n - 69) / 12); }
function musicTick(){
  if(!AC || !musicGain) return;
  const song = SONGS[musicState] || SONGS.lobby;
  const step = 60 / song.bpm / 2;
  const hot = G.phase === 'day' && G.S.dust > 0.2;
  while(musicNext < AC.currentTime + 0.2){
    const t = musicNext, i = musicStep % 16;
    const b = song.bass[i];
    if(b) pluck(mtof(b - 12), step * 1.6, 'triangle', 0.5, t);
    const l = song.lead[i];
    if(l && (musicStep % 32 < 16 || musicState !== 'day' || i % 2 === 0)) pluck(mtof(l), step * 1.2, 'sawtooth', 0.12, t, true);
    if(i % 4 === 0) kick(t);
    if(i % 4 === 2) brush(t, 0.25);
    if(i % 2 === 1) brush(t, 0.08);
    if(hot && i % 8 === 0) brush(t, 0.2);
    musicStep++; musicNext += step;
  }
}
function pluck(f, d, type, vol, t, twang){
  const o = AC.createOscillator(), g = AC.createGain(), fl = AC.createBiquadFilter();
  o.type = type; o.frequency.setValueAtTime(f, t);
  if(twang){ o.frequency.setValueAtTime(f * 0.97, t); o.frequency.linearRampToValueAtTime(f, t + 0.05); }
  fl.type = 'lowpass'; fl.frequency.setValueAtTime(twang ? 2600 : 900, t); fl.frequency.exponentialRampToValueAtTime(300, t + d);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
  o.connect(fl); fl.connect(g); g.connect(musicGain); o.start(t); o.stop(t + d + 0.05);
}
function kick(t){ const o = AC.createOscillator(), g = AC.createGain(); o.frequency.setValueAtTime(110, t); o.frequency.exponentialRampToValueAtTime(40, t + 0.15); g.gain.setValueAtTime(0.6, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.2); o.connect(g); g.connect(musicGain); o.start(t); o.stop(t + 0.25); }
function brush(t, vol){ const s = AC.createBufferSource(); s.buffer = noiseBuf; const f = AC.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = 5000; const g = AC.createGain(); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.08); s.connect(f); f.connect(g); g.connect(musicGain); s.start(t, Math.random()); s.stop(t + 0.1); }

/* ---------------- go ---------------- */
openRoom();
setInterval(tick, 1000 / 60);
setInterval(broadcast, 100);
setInterval(sweep, 1000);
setInterval(() => { engineTick(); musicTick(); }, 50);
rebuildVans();
requestAnimationFrame(frame);
// for netcheck and the curious
window.WTV = {G, NET, M, startDay, startParade, toLobby, scene, renderer};
