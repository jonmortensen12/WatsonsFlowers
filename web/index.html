<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Watson's Flowers</title>
<meta name="description" content="A family delivery game: Watson's Flowers, Mesa and Gilbert, Arizona. The TV is the town, every phone is a job.">
<meta property="og:title" content="Watson's Flowers">
<meta property="og:description" content="Deliver the flowers. Mind the goons.">
<meta property="og:image" content="og.png">
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#f2a7b4">
<style>
  html, body { margin: 0; height: 100%; background: #111; overflow: hidden; }
  body { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; color: #fff; user-select: none; cursor: default; }
  canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; }
  #hud { pointer-events: none; }
  #loading { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; font: 600 28px Georgia, serif; color: #f2c531; background: #1b1414; z-index: 5; }
</style>
</head>
<body>
<canvas id="gl"></canvas>
<canvas id="hud"></canvas>
<div id="loading">Opening the shop...</div>
<script src="geo.js"></script>
<script src="map.js"></script>
<script src="sim.js"></script>
<script src="net.js"></script>
<script src="qr.js"></script>
<script src="bouquet.js"></script>
<script type="module">
import * as THREE from './lib/three.module.min.js';
import {buildWorld, makeSign, labelTex, canvas as mkCanvas, tex} from './world.js';
import {createView} from './view.js';

/* Watson's Flowers - the TV.

   Hosts the room, runs the simulation at 60 steps a second, and draws the
   town once for every driver (split screen, up to six vans), the shop's
   numbers across the top, and the lobby, results and parade.

   No phones? Press Enter to open the shop; the arrow keys drive van 1
   (Shift boosts, Space throws), the computer does everything else.
   ?local=1 plus controller.html?local=1#CODE in other tabs: phones
   without the internet. P pauses, M mutes, F fullscreen. */

const PROTO = 1, PROTO_MIN = 1;
const SIM = WSim, DT = SIM.DT;
const ROLES = ['drive', 'toss', 'arrange', 'grow', 'dispatch', 'cart'];
const ROLE_NAMES = {drive: 'Driver', toss: 'Tosser', arrange: 'Arranger', grow: 'Grower', dispatch: 'Dispatcher', cart: 'Rose cart'};
const HOLIDAYS = SIM.HOLIDAYS, HKEYS = SIM.HOLIDAY_KEYS;

/* ---------------- the save ---------------- */
let SAVE = {records: {}, days: 0, holiday: 'thanksgiving'};
try { Object.assign(SAVE, JSON.parse(localStorage.getItem('wats_save') || '{}')); } catch(e){}
function storeSave(){ try { localStorage.setItem('wats_save', JSON.stringify(SAVE)); } catch(e){} }

/* ---------------- the town ---------------- */
const M = WMap.build(WGEO, 1927);
const G = {S: null, phase: 'lobby', paused: false, phaseT: 0, ticker: [], msgs: {}, flash: 0, recordNew: false, kbd: {}};
function newSim(){
  G.S = SIM.create(M, {seed: (Date.now() & 0xffff) + 1, holiday: SAVE.holiday});
}
newSim();

/* ---------------- the room ---------------- */
const NET = {code: null, handle: null, status: 'Opening the room...', people: {}};
function controllerUrl(){
  const base = location.href.split('#')[0].split('?')[0].replace(/[^/]*$/, '');
  return base + 'controller.html' + (WNet.isLocal() ? '?local=1' : '') + '#' + NET.code;
}
function openRoom(){
  NET.status = 'Opening the room...';
  NET.handle = WNet.host({
    open: code => { NET.code = code; NET.status = ''; qrCache = null; },
    conn: c => wireConn(c),
    error: msg => { NET.status = msg + ' Retrying...'; NET.code = null; setTimeout(() => { if(!NET.code) openRoom(); }, 4000); }
  });
}
function wireConn(c){
  let id = null;
  c.on('data', d => {
    if(!d || typeof d !== 'object') return;
    if(d.t === 'hello'){
      id = String(d.dev || c.peer).slice(0, 40);
      const old = NET.people[id];
      if(old && old.conn && old.conn !== c){ try { old.conn.close(); } catch(e){} }
      const p = old || {id, role: null, van: -1, ride: null, inp: {}, seen: 0, joined: performance.now()};
      p.name = cleanName(d.name) || p.name || 'Helper';
      p.conn = c; p.lastConn = c; p.gone = 0; p.seen = performance.now();
      NET.people[id] = p;
      send(p, {t: 'host', proto: PROTO, min: PROTO_MIN});
      tellYou(p);
      ticker(p.name + ' is here');
      return;
    }
    const p = id && NET.people[id];
    if(!p) return;
    if(!p.conn && p.lastConn === c){ p.conn = c; p.gone = 0; seatBack(p); }
    if(p.conn !== c) return;
    p.seen = performance.now();
    onPhone(p, d);
  });
  c.on('close', () => { const p = id && NET.people[id]; if(p && p.conn === c){ p.conn = null; p.gone = performance.now(); away(p); } });
}
function cleanName(n){ return String(n || '').replace(/[^\p{L}\p{N} '\-]/gu, '').trim().slice(0, 14); }
function send(p, m){ if(p && p.conn){ try { p.conn.send(m); } catch(e){} } }
function everyone(m){ Object.values(NET.people).forEach(p => send(p, m)); }
function present(){ return Object.values(NET.people).filter(p => p.conn); }

function sweep(){
  const now = performance.now();
  Object.values(NET.people).forEach(p => {
    if(p.conn && now - p.seen > 6000){ p.conn = null; p.gone = now; away(p); }
    if(!p.conn && now - p.gone > 30000){ release(p); delete NET.people[p.id]; }
  });
  countRoles();
}
/* a driver who goes quiet: the computer takes the wheel until they are back */
function away(p){
  const S = G.S;
  if(p.role === 'drive' && p.van >= 0 && S.vans[p.van] && S.vans[p.van].owner === p.id){ SIM.setOwner(S, p.van, null); S.vans[p.van].name = p.name + ' (computer)'; }
}
function seatBack(p){
  const S = G.S;
  if(p.role === 'drive' && p.van >= 0 && S.vans[p.van] && !S.vans[p.van].owner){ SIM.setOwner(S, p.van, p.id, p.name, true); sendDrv(p); }
  tellYou(p);
}
function release(p){
  const S = G.S;
  if(p.role === 'drive' && p.van >= 0 && S.vans[p.van] && (S.vans[p.van].owner === p.id || !S.vans[p.van].owner)){ SIM.setOwner(S, p.van, null); S.vans[p.van].name = 'Computer'; }
}
function countRoles(){
  const S = G.S, r = {arr: 0, grow: 0, disp: 0, cart: 0};
  present().forEach(p => { if(p.role === 'arrange') r.arr++; else if(p.role === 'grow') r.grow++; else if(p.role === 'dispatch') r.disp++; else if(p.role === 'cart') r.cart++; });
  S.roles = r;
}
function drivers(){ return Object.values(NET.people).filter(p => p.role === 'drive').sort((a, b) => a.joined - b.joined); }
function vanFor(p){
  // where a tosser rides: with the driver they picked, else van 1
  const S = G.S;
  if(p.ride){ const d = NET.people[p.ride]; if(d && d.van >= 0 && S.vans[d.van]) return d.van; }
  if(p.rideVan != null && S.vans[p.rideVan]) return p.rideVan;
  return S.vans.length ? 0 : -1;
}
function tellYou(p){
  const S = G.S;
  if(p.role === 'toss') p.van = vanFor(p);
  const drv = drivers().map(d => [d.id, d.name, d.van]);
  const vans = S.vans.map(v => [v.i, v.name, v.color]);
  send(p, {t: 'you', role: p.role, van: p.van, name: p.name, id: p.id, ph: G.phase, drv, vans, hol: SAVE.holiday});
}
function tellAll(){ Object.values(NET.people).forEach(tellYou); }
/* a driver's phone takes the van from here */
function sendDrv(p){
  const S = G.S, v = p.van >= 0 && S.vans[p.van];
  if(!v || !p.conn) return;
  send(p, {t: 'drv', i: v.i, x: v.x, z: v.z, h: v.crash ? v.crash.h || v.h : v.h, color: v.color, boost: v.boost});
}

/* picking a job */
function pick(p, role, opt){
  const S = G.S;
  if(ROLES.indexOf(role) < 0) return;
  // leaving the wheel hands the van to the computer
  if(p.role === 'drive' && role !== 'drive') release(p);
  p.role = role; p.inp = {};
  if(role === 'drive'){
    if(G.phase === 'day' || G.phase === 'count'){
      let v = S.vans.findIndex(q => !q.owner);
      if(v < 0) v = SIM.addVan(S, p.id, p.name);
      if(v < 0){ p.role = null; send(p, {t: 'full'}); tellYou(p); return; }
      SIM.setOwner(S, v, p.id, p.name, true);
      p.van = v;
      syncVans();
      sendDrv(p);
    } else {
      if(drivers().length > SIM.MAX_VANS){ p.role = null; send(p, {t: 'full'}); }
      p.van = -1;
    }
  } else if(role === 'toss'){
    p.ride = opt && opt.ride || null;
    p.rideVan = opt && opt.van != null ? +opt.van : null;
    p.van = vanFor(p);
  } else p.van = -1;
  countRoles();
  tellAll();
  sfx('click');
  ticker(p.name + ' is ' + (role === 'arrange' ? 'arranging' : role === 'grow' ? 'in the garden' : role === 'dispatch' ? 'on dispatch' : role === 'cart' ? 'pushing the rose cart' : role === 'toss' ? 'riding shotgun' : 'driving'));
}

function onPhone(p, d){
  const S = G.S;
  switch(d.t){
    case 'pick': pick(p, d.role, d); break;
    case 'name': p.name = cleanName(d.name) || p.name; if(p.role === 'drive' && S.vans[p.van] && S.vans[p.van].owner === p.id){ S.vans[p.van].name = p.name; refreshTag(p.van); } tellAll(); break;
    case 'in': if(p.role === 'drive') p.inp = d; break;
    case 'vs': if(p.role === 'drive' && p.van >= 0 && S.vans[p.van] && S.vans[p.van].owner === p.id) SIM.remoteState(S, p.van, d.a); break;
    case 've': if(p.role === 'drive' && p.van >= 0 && S.vans[p.van] && S.vans[p.van].owner === p.id) SIM.remoteEvent(S, p.van, d.e); break;
    case 'act': {
      const a = d.a; if(!a || !a.a) return;
      const ok = {
        claim: 'arrange', stem: 'arrange', wrap: 'arrange', ribbon: 'arrange', done: 'arrange', drop: 'arrange',
        water: 'grow', harvest: 'grow', rose: 'cart', assign: 'dispatch', prio: 'dispatch', ping: 'dispatch'
      }[a.a];
      if(a.a === 'toss'){
        if(p.role === 'drive'){ a.v = p.van; a.auto = true; }
        else if(p.role === 'toss'){ a.v = p.van = vanFor(p); a.auto = false; }
        else return;
      } else if(a.a === 'ptoss'){ /* everybody throws at the parade */ }
      else if(ok && ok !== p.role) return;
      SIM.act(S, p.id, p.name, a);
      break;
    }
    case 'start':
      if(G.phase === 'lobby'){ if(d.hol && HOLIDAYS[d.hol]) SAVE.holiday = d.hol; startDay(); }
      break;
    case 'hol':
      if(G.phase === 'lobby' && HOLIDAYS[d.k]){ SAVE.holiday = d.k; storeSave(); G.S.holiday = d.k; tellAll(); sfx('click'); }
      break;
    case 'next':
      if(G.phase === 'end' && G.phaseT > 3) startParade();
      else if(G.phase === 'results' && G.phaseT > 2) toLobby();
      break;
    case 'pause':
      if(G.phase === 'day'){ G.paused = !!d.v; G.S.paused = G.paused; sfx('click'); }
      break;
  }
}

/* what every phone is told, ten times a second */
function broadcast(){
  const S = G.S;
  const s = SIM.snap(S);
  s.t = 's'; s.phase = G.phase; s.paused = G.paused;
  s.ppl = Object.values(NET.people).map(p => [p.name, p.role || '', p.van, p.conn ? 1 : 0, p.id]);
  s.rec = SAVE.records[SAVE.holiday] || 0;
  if(G.phase === 'end' || G.phase === 'results') s.res = S.results ? {money: S.money, del: S.results.delivered, aw: S.results.awards, cheers: S.cheers} : null;
  everyone(s);
  // the van's own numbers for its driver and tossers
  Object.values(NET.people).forEach(p => {
    if((p.role === 'drive' || p.role === 'toss') && p.van >= 0 && S.vans[p.van]){
      const vi = SIM.vanInfo(S, p.van);
      vi.t = 'v'; vi.i = p.van;
      send(p, vi);
    }
  });
}

/* ---------------- the day ---------------- */
function startDay(){
  const S = G.S = SIM.create(M, {seed: (Date.now() & 0xffff) + 1, holiday: SAVE.holiday});
  drivers().slice(0, SIM.MAX_VANS).forEach(p => {
    const v = SIM.addVan(S, p.conn ? p.id : null, p.name);
    if(p.conn) SIM.setOwner(S, v, p.id, p.name, true);
    p.van = v;
  });
  if(!S.vans.length) SIM.addVan(S, null, 'Computer');
  if(G.kbdDriver && !S.vans[0].owner){ SIM.setOwner(S, 0, 'kbd', 'Keyboard'); }
  countRoles();
  SIM.start(S, SAVE.holiday);
  G.phase = 'count'; G.phaseT = 0; G.paused = false; G.recordNew = false;
  rebuildVans();
  clearFx();
  tellAll();
  drivers().forEach(sendDrv);
  musicMode('day');
}
function endOfDay(){
  G.phase = 'end'; G.phaseT = 0;
  const S = G.S;
  const best = SAVE.records[S.holiday] || 0;
  if(S.money > best){ SAVE.records[S.holiday] = S.money; G.recordNew = true; }
  SAVE.days++;
  storeSave();
  tellAll();
  musicMode('results');
  cue('end');
}
function startParade(){
  SIM.startParade(G.S);
  G.phase = 'parade'; G.phaseT = 0;
  buildParade();
  tellAll();
  musicMode('parade');
}
function toLobby(){
  G.phase = 'lobby'; G.phaseT = 0;
  if(parade){ scene.remove(parade.grp); scene.remove(parade.crowd); parade = null; }
  newSim();
  Object.values(NET.people).forEach(p => { if(p.role === 'drive') p.van = -1; });
  rebuildVans();
  clearFx();
  tellAll();
  musicMode('lobby');
}

/* ---------------- the clock ---------------- */
let lastT = performance.now(), acc = 0, simTime = 0;
function tick(){
  const now = performance.now();
  acc += Math.min(0.25, (now - lastT) / 1000);
  lastT = now;
  while(acc >= DT){
    acc -= DT;
    stepOnce();
  }
}
function stepOnce(){
  const S = G.S;
  G.phaseT += DT;
  // inputs: phones and the keyboard
  if(G.phase === 'day' || G.phase === 'count'){
    Object.values(NET.people).forEach(p => {
      if(p.role === 'drive' && p.van >= 0 && S.vans[p.van] && S.vans[p.van].owner === p.id) SIM.input(S, p.van, p.inp);
    });
    if(S.vans[0] && S.vans[0].owner === 'kbd') SIM.input(S, 0, kbdInput());
  }
  // remember where everything was, for smooth drawing
  S.vans.forEach(v => { v.px = v.x; v.pz = v.z; v.py = v.y; v.ph = v.h; });
  SIM.step(S);
  simTime += DT;
  S.ev.forEach(onEvent);
  if(G.phase === 'count' && S.ph === 'day'){ G.phase = 'day'; G.phaseT = 0; }
  if(G.phase === 'day' && S.ph === 'end') endOfDay();
  if(G.phase === 'parade' && S.ph === 'results'){ G.phase = 'results'; G.phaseT = 0; tellAll(); cue('cheer'); }
  if(G.phase === 'end' && G.phaseT > 14) startParade();
  if(G.phase === 'results' && G.phaseT > 60) toLobby();
}

/* ---------------- keyboard ---------------- */
let kbSteer = 0;
function kbdInput(){
  const k = G.kbd;
  const want = (k.ArrowRight || k.KeyD ? 1 : 0) - (k.ArrowLeft || k.KeyA ? 1 : 0);
  kbSteer += Math.max(-DT * 5, Math.min(DT * 5, want - kbSteer));
  if(!want && Math.abs(kbSteer) < 0.05) kbSteer = 0;
  return {st: kbSteer, gas: k.ArrowUp || k.KeyW, brk: k.ArrowDown || k.KeyS, bst: k.ShiftLeft || k.ShiftRight};
}
addEventListener('keydown', e => {
  G.kbd[e.code] = true;
  soundOn();
  if(['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'KeyW', 'KeyA', 'KeyS', 'KeyD'].includes(e.code)){
    e.preventDefault();
    G.kbdDriver = true;
    const S = G.S;
    if(S.vans[0] && !S.vans[0].owner && (G.phase === 'day' || G.phase === 'count')){ SIM.setOwner(S, 0, 'kbd', 'Keyboard'); refreshTag(0); }
  }
  if(e.repeat) return;
  if(e.code === 'Enter'){
    if(G.phase === 'lobby') startDay();
    else if(G.phase === 'end') startParade();
    else if(G.phase === 'results') toLobby();
  }
  if(e.code === 'Space'){
    e.preventDefault();
    if(G.phase === 'day' && G.S.vans[0]) SIM.act(G.S, 'kbd', 'Keyboard', {a: 'toss', v: 0, ang: 0, pow: 0.5, auto: true});
    if(G.phase === 'parade') SIM.act(G.S, 'kbd', 'Keyboard', {a: 'ptoss', ang: Math.random() < 0.5 ? Math.PI / 2 : -Math.PI / 2, pow: 0.5});
  }
  if(e.code === 'KeyP' && G.phase === 'day'){ G.paused = !G.paused; G.S.paused = G.paused; }
  if(e.code === 'KeyM') toggleMute();
  if(e.code === 'KeyF'){ if(document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen().catch(() => {}); }
  if(e.code === 'KeyH' && G.phase === 'lobby'){ const i = (HKEYS.indexOf(SAVE.holiday) + 1) % HKEYS.length; SAVE.holiday = HKEYS[i]; G.S.holiday = SAVE.holiday; storeSave(); tellAll(); }
});
addEventListener('keyup', e => { G.kbd[e.code] = false; });
addEventListener('blur', () => { G.kbd = {}; });
addEventListener('pointerdown', () => soundOn());

/* ---------------- three.js: the action cam, the lobby, the parade ---------------- */
const glc = document.getElementById('gl');
// ?norender=1: run everything but the 3D drawing (netcheck, on a machine with no GPU)
const NORENDER = /(^|[?&])norender=1(&|$)/.test(location.search);
const renderer = new THREE.WebGLRenderer({canvas: glc, antialias: true, powerPreference: 'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.autoClear = false;
const scene = new THREE.Scene();
const world = buildWorld(scene, M);
const V = createView(scene, M);
const hud = document.getElementById('hud'), H = hud.getContext('2d');
let VW = 0, VH = 0, DPR = 1;
function resize(){
  DPR = Math.min(devicePixelRatio, 1.5);
  VW = innerWidth; VH = innerHeight;
  renderer.setSize(VW, VH, false);
  hud.width = Math.round(VW * DPR); hud.height = Math.round(VH * DPR);
  mapCache = null;
}
addEventListener('resize', resize);
WBouquet.load(() => { bqCache = {}; rebuildVans(); });

/* vans, as the view draws them */
function syncVans(){
  G.S.vans.forEach((v, i) => V.van(i, v.color, v.name));
}
function refreshTag(i){ const v = G.S.vans[i]; if(v) V.tag(i, v.name); }
function rebuildVans(){ V.dropAll(); syncVans(); }
let brokenShown = {};
function clearFx(){
  V.clear();
  M.props.forEach((p, i) => world.setProp(i, true));
  brokenShown = {};
  G.feat = null;
}

/* ---------------- pings from dispatch ---------------- */
const pingObjs = [];
function drawPings(S, t){
  S.pings.forEach((p, i) => {
    let o = pingObjs[i];
    if(!o){
      o = new THREE.Mesh(new THREE.CylinderGeometry(2, 2, 80, 12, 1, true).translate(0, 40, 0), new THREE.MeshBasicMaterial({color: '#ff3a3a', transparent: true, opacity: 0.3, depthWrite: false, side: THREE.DoubleSide}));
      scene.add(o); pingObjs[i] = o;
    }
    o.visible = true; o.position.set(p.x, 0, p.z);
    o.material.opacity = 0.2 + 0.15 * Math.sin(t * 8);
  });
  for(let i = S.pings.length; i < pingObjs.length; i++) pingObjs[i].visible = false;
}

/* ---------------- the parade ---------------- */
let parade = null;
function buildParade(){
  const S = G.S, Pd = S.parade, l = M.gilbertLine;
  const grp = new THREE.Group();
  const truck = new THREE.Mesh(new THREE.BoxGeometry(2.2, 1.8, 5), new THREE.MeshLambertMaterial({color: '#e8e8e8'}));
  truck.position.set(0, 1.2, 8); grp.add(truck);
  const deck = new THREE.Mesh(new THREE.BoxGeometry(4.4, 1.2, 10), new THREE.MeshLambertMaterial({color: '#f2a7b4'}));
  deck.position.set(0, 1.2, -1); grp.add(deck);
  // the float is heaped with the real flowers
  const keys = ['rose', 'sunflower', 'mum', 'lily', 'carnation', 'daisy'];
  for(let i = 0; i < 46; i++){
    const im = WBouquet.img[keys[i % keys.length]];
    if(!im || !im.naturalWidth) continue;
    const t = new THREE.Texture(im); t.needsUpdate = true; t.colorSpace = THREE.SRGBColorSpace;
    const sp = new THREE.Sprite(new THREE.SpriteMaterial({map: t, transparent: true}));
    sp.scale.set(1.1, 1.1 * im.naturalHeight / im.naturalWidth, 1);
    sp.position.set((Math.random() - 0.5) * 4, 2.1 + Math.random() * 0.5, -1 + (Math.random() - 0.5) * 9.4);
    grp.add(sp);
  }
  const sign = makeSign(world.signTex); sign.scale.setScalar(0.32); sign.rotation.y = Math.PI / 2; sign.position.set(0, 1.6, -4.5); grp.add(sign);
  const girl = new THREE.Group();
  const dress = new THREE.Mesh(new THREE.ConeGeometry(0.45, 1.1, 12), new THREE.MeshLambertMaterial({color: '#ffffff'})); dress.position.y = 0.55; girl.add(dress);
  const head = new THREE.Mesh(new THREE.SphereGeometry(0.22, 12, 10), new THREE.MeshLambertMaterial({color: '#f0c8a0'})); head.position.y = 1.3; girl.add(head);
  const hair = new THREE.Mesh(new THREE.SphereGeometry(0.24, 12, 10, 0, Math.PI * 2, 0, Math.PI * 0.6), new THREE.MeshLambertMaterial({color: '#7a4a24'})); hair.position.y = 1.33; girl.add(hair);
  const crown = new THREE.Mesh(new THREE.TorusGeometry(0.2, 0.05, 6, 12).rotateX(Math.PI / 2), new THREE.MeshLambertMaterial({color: '#f7cfd6'})); crown.position.y = 1.5; girl.add(crown);

const pendingEv = {};

function shareEvent(e){
  if(!LOOK[e.k] || e.x == null) return;
  Object.values(NET.people).forEach(p => {
    if(p.role !== 'drive' || p.van < 0) return;
    const v = G.S.vans[p.van]; if(!v) return;

function worldTick(){
  const S = G.S;
  const live = G.phase === 'day' || G.phase === 'count';
  const pk = M.pickups.filter(q => (S.pickupT[q.id] || 0) > S.t || (q.k === 'boom' && S.boomUsed)).map(q => q.id);
  if(S.boomUsed) pk.push(-1);
  const br = Object.keys(S.broken).map(Number);

  Object.values(NET.people).forEach(p => {
    if(p.role !== 'drive' || !p.conn) return;
    const v = p.van >= 0 && S.vans[p.van];
    const w = {t: 'w', st: r2(S.t), clk: r2(S.clock), dust: r2(S.dust), gx: r1(S.gust.x), gz: r1(S.gust.z), ph: live ? S.ph : G.phase, hol: S.holiday, br, pk};

        if(Math.abs(c.x - v.x) > 280 || Math.abs(c.z - v.z) > 280) return;
        const a = [c.id, r1(c.x), r1(c.z), r2(c.h), r1(c.v), SIM.CAR_KINDS.findIndex(k => k.k === c.kind), c.color];
        if(c.wreck) a.push(r2(c.wreck.y), r2(c.wreck.ax), r2(c.wreck.ay), r2(c.wreck.az));
        w.cars.push(a);
      });
      w.vans = S.vans.filter(o => o !== v).map(o => {
        const a = [o.i, r1(o.x), r1(o.z), r2(o.y), r2(o.crash && o.crash.h != null ? o.crash.h : o.h), o.i, o.name];
        if(o.crash) a.push(r2(o.crash.ax || 0), r2(o.crash.ay || 0), r2(o.crash.az || 0));
        return a;
      });
      w.goons = S.goons.filter(g => g.st !== 'gone' && Math.abs(g.x - v.x) < 280 && Math.abs(g.z - v.z) < 280)
        .map(g => [r1(g.x), r2(g.y || 0), r1(g.z), r2(g.h), g.st === 'flung' ? 2 : g.st === 'flee' ? 1 : 0, r2(g.spin || 0), g.color, g.carry != null ? 1 : 0]);
      w.tgt = v.tgt ? {k: v.tgt.k, id: v.tgt.id} : null;
    }
    if(pendingEv[p.id] && pendingEv[p.id].length){ w.ev = pendingEv[p.id]; pendingEv[p.id] = []; }
    send(p, w);
  });
}

    }

    const a = wallT * 0.08;
    overview.position.set(sg.x + Math.cos(a) * 34, 7 + Math.sin(wallT * 0.2) * 2, sg.z - 20 + Math.sin(a) * 30);
    overview.lookAt(sg.x, 8.5, sg.z);
    world.update(hour, 0, wallT, overview.position);
    if(!NORENDER) renderer.render(scene, overview);
    drawLobby();
  }
  if(document.getElementById('loading')) document.getElementById('loading').remove();
}
/* which van the action cam is on */
function featured(){
  const S = G.S, n = S.vans.length;
  if(!n) return 0;
  if(G.feat && G.feat.until > wallT && S.vans[G.feat.i]) return G.feat.i;
  // otherwise take turns, nine seconds each, the fastest first
  if(!G.turn || wallT > G.turn.until || !S.vans[G.turn.i]){
    const next = G.turn ? (G.turn.i + 1) % n : 0;
    G.turn = {i: next, until: wallT + 9};
  }
  return G.turn.i;
}

function drawTicker(B){

/* ---------------- the board: the town, the drivers, the shop ---------------- */
function boardLayout(){

  const cx = pad + mapW + pad, cw = VW - cx - pad;
  let ch = Math.round(cw * 9 / 16);

  const cam = [cx, top, cw, ch];
  const restY = top + ch + 10, restH = VH - restY - pad;
  const n = Math.max(1, G.S.vans.length);
  const cardsH = Math.min(restH * 0.58, Math.ceil(n / 2) * 96);

}

function benchPic(o, w){
  const key = o.id + ':' + o.arr.st.join(',') + (o.arr.wrap || '') + (o.arr.rib || '');
  if(benchCache[o.id] && benchCache[o.id].key === key) return benchCache[o.id].c;
  const c = WBouquet.canvas({st: o.arr.st, wrap: o.arr.wrap, rib: o.arr.rib, seed: o.id}, w);
  benchCache[o.id] = {key, c};
  return c;
}
function mapScale(r){
  const s = Math.min(r[2] / (M.bounds.x1 - M.bounds.x0), r[3] / (M.bounds.z1 - M.bounds.z0));
  const w = (M.bounds.x1 - M.bounds.x0) * s, h = (M.bounds.z1 - M.bounds.z0) * s;
  return {s, ox: r[0] + (r[2] - w) / 2 - M.bounds.x0 * s, oy: r[1] + (r[3] - h) / 2 - M.bounds.z0 * s, w, h, x0: r[0] + (r[2] - w) / 2, y0: r[1] + (r[3] - h) / 2};
}
function buildMap(r){
  const ms = mapScale(r), k = DPR;
  const c = mkCanvas(Math.ceil(ms.w * k), Math.ceil(ms.h * k)), g = c.getContext('2d');
  g.scale(k, k); g.translate(-ms.x0 + ms.ox, -ms.y0 + ms.oy); g.scale(ms.s, ms.s);
  const s = ms.s;
  g.fillStyle = '#d8bf93'; g.fillRect(M.bounds.x0, M.bounds.z0, M.bounds.x1 - M.bounds.x0, M.bounds.z1 - M.bounds.z0);
  M.cells.forEach(cl => {
    const col = {homes: '#b9c98f', grandpa: '#b9c98f', strip: '#c4cc9a', park: '#93bf6c', pondpark: '#93bf6c', riparian: '#8fbf7a', temple: '#a9d08a',
      grove: '#7fa45a', farm: '#c9b277', plaza: '#cfc7b8', downtown: '#c9b8a6', heritage: '#c9b8a6', campus: '#cfc7b8', school: '#c9c08f', watsons: '#f2c6cf'}[cl.type];
    if(col){ g.fillStyle = col; g.fillRect(cl.x0, cl.z0, cl.x1 - cl.x0, cl.z1 - cl.z0); }
  });
  // houses as tiny roofs
  g.fillStyle = 'rgba(170,80,55,0.55)';
  M.houses.forEach(h => g.fillRect(h.x0, h.z0, h.x1 - h.x0, h.z1 - h.z0));
  M.ponds.forEach(p => { g.fillStyle = '#5aa8b0'; g.beginPath(); g.ellipse(p.x, p.z, p.rx, p.rz, 0, 0, Math.PI * 2); g.fill(); });
  g.strokeStyle = '#4aa3a8'; g.lineWidth = 9 / Math.max(0.3, s * 3); g.lineCap = 'round'; g.lineJoin = 'round';
  M.canals.forEach(cn => { g.beginPath(); cn.pts.forEach((p, i) => i ? g.lineTo(p[0], p[1]) : g.moveTo(p[0], p[1])); g.lineWidth = 10; g.stroke(); });
  g.strokeStyle = '#8a8a8a'; g.lineWidth = 6;
  M.resRoads.forEach(rr => { g.fillStyle = '#9a958c'; g.fillRect(rr.x0, rr.z0, rr.x1 - rr.x0, rr.z1 - rr.z0); });
  M.lines.forEach(l => {
    g.strokeStyle = l.kind === 'fwy' ? '#e8b93a' : l.kind === 'art' ? '#5b5650' : '#7d776e';
    g.lineWidth = l.kind === 'fwy' ? 30 : l.kind === 'art' ? 20 : 12;
    g.beginPath();
    if(l.axis === 'ns'){ g.moveTo(l.p, l.lo); g.lineTo(l.p, l.hi); } else { g.moveTo(l.lo, l.p); g.lineTo(l.hi, l.p); }
    g.stroke();
  });
  // street names along the arterials
  g.fillStyle = 'rgba(255,255,255,0.9)'; g.textBaseline = 'middle';
  const fs = Math.max(11, 13 / s) ;
  g.font = 'bold ' + fs + 'px system-ui, sans-serif';
  M.lines.filter(l => l.kind !== 'col').forEach(l => {
    if(l.axis === 'ew'){ g.textAlign = 'left'; const n = M.lineName(l, 0); g.lineWidth = 4; g.strokeStyle = 'rgba(0,0,0,0.5)'; g.strokeText(n, M.bounds.x0 + 40, l.p - fs * 0.9); g.fillText(n, M.bounds.x0 + 40, l.p - fs * 0.9); }
    else { [M.bounds.z0 + 30, (M.bounds.z0 + M.bounds.z1) / 2 + 200].forEach(z => { const n = M.lineName(l, z + 100); g.save(); g.translate(l.p + fs * 0.9, z); g.rotate(Math.PI / 2); g.textAlign = 'left'; g.strokeStyle = 'rgba(0,0,0,0.5)'; g.lineWidth = 4; g.strokeText(n, 0, 0); g.fillText(n, 0, 0); g.restore(); }); }
  });
  mapCache = {c, r: r.slice(), ms};
}
let labelBox = null;
function mapLabel(text, x, y, color, size){
  H.font = 'bold ' + (size || 13) + 'px system-ui, sans-serif';
  const w = H.measureText(text).width + 12;
  if(labelBox){ x = Math.max(labelBox[0] + w / 2 + 2, Math.min(labelBox[0] + labelBox[2] - w / 2 - 2, x)); y = Math.max(labelBox[1] + 12, Math.min(labelBox[1] + labelBox[3] - 12, y)); }
  H.fillStyle = 'rgba(20,12,14,0.78)'; roundRect(H, x - w / 2, y - 10, w, 20, 8); H.fill();
  H.fillStyle = color || '#fff'; H.textAlign = 'center'; H.textBaseline = 'middle'; H.fillText(text, x, y + 0.5);
}
function drawBoard(B, dt){
  const S = G.S;
  // the map
  const r = B.map;

  const ms = mapCache.ms;

  H.drawImage(mapCache.c, ms.x0, ms.y0, ms.w, ms.h);
  const X = x => ms.ox + x * ms.s, Z = z => ms.oy + z * ms.s;
  labelBox = [ms.x0, ms.y0, ms.w, ms.h];
  H.save(); H.beginPath(); H.rect(ms.x0, ms.y0, ms.w, ms.h); H.clip();
  // traffic, faintly
  H.fillStyle = 'rgba(40,40,50,0.55)';
  S.cars.forEach(c => H.fillRect(X(c.x) - 1.5, Z(c.z) - 1.5, 3, 3));
  // landmarks
  const lm = WGEO.lm;
  [['temple', 'Mesa Temple'], ['neon', 'Neon Garden'], ['tower', 'Water Tower'], ['riparian', 'Riparian Preserve'], ['freestone', 'Freestone Park'], ['mcc', 'MCC']].forEach(([k, n]) => {
    const p = lm[k]; if(p) { H.globalAlpha = 0.75; mapLabel(n, X(p.x), Z(p.z), '#f4ecd2', 11); H.globalAlpha = 1; }
  });
  // the orders: where every bouquet is wanted
  S.orders.forEach(o => {
    if(o.kind !== 'del' || o.state === 'done' || o.state === 'lost' || o.house < 0) return;
    const h = M.houses[o.house], x = X(h.x), y = Z(h.z);
    if(o.state === 'van'){
      const v = S.vans[o.van];
      H.fillStyle = '#fff'; H.beginPath(); H.arc(x, y, 6, 0, Math.PI * 2); H.fill();
      H.strokeStyle = v ? v.color : '#fff'; H.lineWidth = 3; H.stroke();
    } else {
      H.fillStyle = o.state === 'ready' ? '#ff6fa6' : o.state === 'stolen' ? '#ff3a3a' : 'rgba(60,30,40,0.6)';
      H.beginPath(); H.arc(x, y, o.state === 'ready' ? 5 : 3.5, 0, Math.PI * 2); H.fill();
    }
  });
  // the shops
  M.shops.forEach(sh => {
    const x = X(sh.x), y = Z(sh.z);
    H.fillStyle = '#f2a7b4'; H.beginPath(); H.arc(x, y, 11, 0, Math.PI * 2); H.fill(); H.strokeStyle = '#fff'; H.lineWidth = 3; H.stroke();
    H.fillStyle = '#7a1f3a'; H.font = 'bold 12px Georgia'; H.textAlign = 'center'; H.textBaseline = 'middle'; H.fillText('W', x, y + 1);
    mapLabel(sh.key === 'watsons' ? "Watson's - 2525 W Main" : "Grandpa's - 122 E Palo Verde", x, y + 22, '#f7cfd6', 12);
  });
  // goons
  S.goons.forEach(g => {
    if(g.st === 'gone') return;
    const x = X(g.x), y = Z(g.z);
    H.fillStyle = g.carry != null ? '#ff2a2a' : '#c43c3c'; H.beginPath(); H.arc(x, y, 5, 0, Math.PI * 2); H.fill();
    H.fillStyle = '#fff'; H.font = 'bold 8px system-ui'; H.textAlign = 'center'; H.fillText('G', x, y + 0.5);
  });
  // dispatch pings
  S.pings.forEach(p => { H.strokeStyle = '#ff3a3a'; H.lineWidth = 3; H.beginPath(); H.arc(X(p.x), Z(p.z), 12 + 4 * Math.sin(wallT * 8), 0, Math.PI * 2); H.stroke(); });
  // the vans, their routes and where they are headed
  S.vans.forEach((v, i) => {
    const vx = v.rx != null ? v.rx : v.x, vz = v.rz != null ? v.rz : v.z;
    const x = X(vx), y = Z(vz);
    if(v.route && v.route.length > 1 && !v.crash){
      H.strokeStyle = v.color; H.globalAlpha = 0.7; H.lineWidth = 3; H.setLineDash([6, 5]);
      H.beginPath(); H.moveTo(x, y); for(let k = v.wp || 1; k < v.route.length; k++) H.lineTo(X(v.route[k].x), Z(v.route[k].z)); H.stroke();
      H.setLineDash([]); H.globalAlpha = 1;
    }
    H.save(); H.translate(x, y); H.rotate(v.rh != null ? v.rh : v.h);
    H.fillStyle = v.color; H.strokeStyle = '#fff'; H.lineWidth = 2;
    roundRect(H, -9, -5.5, 18, 11, 3); H.fill(); H.stroke();
    H.fillStyle = '#fff'; H.beginPath(); H.moveTo(9, 0); H.lineTo(4, -4); H.lineTo(4, 4); H.fill();
    H.restore();
    if(v.crash){ H.strokeStyle = '#ff3a3a'; H.lineWidth = 3; const q = 8 + 3 * Math.sin(wallT * 12); H.beginPath(); H.moveTo(x - q, y - q); H.lineTo(x + q, y + q); H.moveTo(x + q, y - q); H.lineTo(x - q, y + q); H.stroke(); }
    mapLabel(v.name + (v.cargo.length ? '  ' + v.cargo.length + ' 💐' : ''), x, y - 18, v.color, 12);
  });
  // what just happened, where
  for(let k = mapFx.length - 1; k >= 0; k--){
    const f = mapFx[k]; f.t += dt;
    if(f.t > 3){ mapFx.splice(k, 1); continue; }
    const x = X(f.x), y = Z(f.z), u = f.t / 3;
    H.globalAlpha = 1 - u;
    if(f.k === 'crash'){
      for(let j = 0; j < 14; j++){ const a = j / 14 * Math.PI * 2, rr = 8 + u * 40; H.fillStyle = ['#d81b3c', '#f6c21c', '#ef7fa6', '#ffffff'][j % 4]; H.beginPath(); H.arc(x + Math.cos(a) * rr, y + Math.sin(a) * rr, 3, 0, Math.PI * 2); H.fill(); }
      outlined('CRASH!', x, y - 30 - u * 10, 16, '#ff5a5a');
    } else if(f.k === 'paid') outlined('$' + f.pay, x, y - 12 - u * 30, 18, '#7dff6b');
    else if(f.k === 'boom'){ H.strokeStyle = '#ff7a1a'; H.lineWidth = 5; H.beginPath(); H.arc(x, y, 10 + u * 60, 0, Math.PI * 2); H.stroke(); outlined('KABOOM!', x, y - 20, 18, '#ff7a1a'); }
    H.globalAlpha = 1;
  }
  // the haboob rolls in from the southeast
  if(S.dust > 0.02){
    const gr = H.createLinearGradient(ms.x0 + ms.w, ms.y0 + ms.h, ms.x0, ms.y0);
    gr.addColorStop(0, 'rgba(150,105,60,' + (0.6 * S.dust) + ')'); gr.addColorStop(Math.min(1, S.dust * 1.2), 'rgba(150,105,60,' + (0.35 * S.dust) + ')'); gr.addColorStop(1, 'rgba(150,105,60,0)');
    H.fillStyle = gr; H.fillRect(ms.x0, ms.y0, ms.w, ms.h);
  }
  // the heat: a shimmer of orange at the top as it climbs
  const heat = SIM.heat01(S);
  if(heat > 0.5){ H.fillStyle = 'rgba(255,120,40,' + ((heat - 0.5) * 0.18) + ')'; H.fillRect(ms.x0, ms.y0, ms.w, ms.h); }
  H.restore();
  labelBox = null;
  // the legend, above the map
  const ly = Math.max(r[1] + 12, ms.y0 - 14);
  txt('Mesa & Gilbert', ms.x0 + 4, ly, 14, '#f2c531');
  txt('●  ready at the shop', ms.x0 + 140, ly, 12, '#ff6fa6');
  txt('◉  in a van, on its way', ms.x0 + 290, ly, 12, '#fff');
  txt('G  Gilbert Goon', ms.x0 + 460, ly, 12, '#ff8a8a');

  // the action cam's frame and caption
  const c = B.cam, fi = featured(), fv = S.vans[fi];
  H.strokeStyle = fv ? fv.color : '#fff'; H.lineWidth = 3; H.strokeRect(c[0], c[1], c[2], c[3]);
  if(NORENDER){ H.fillStyle = '#222'; H.fillRect(c[0], c[1], c[2], c[3]); }
  if(fv){
    panel(c[0] + 8, c[1] + 8, Math.min(c[2] - 16, 420), 30, 0.6);
    txt('ACTION CAM  ·  ' + fv.name + '  ·  ' + Math.round(fv.spd * 2.237) + ' mph' + (fv.street ? '  ·  ' + fv.street : ''), c[0] + 18, c[1] + 23, 14, '#fff');
    if(G.feat && G.feat.i === fi && G.feat.until > wallT){
      const u = wallT - G.feat.t0;
      outlined(G.feat.why, c[0] + c[2] / 2, c[1] + c[3] * 0.32, Math.min(46, c[2] / 14) * (u < 0.15 ? 1 + (0.15 - u) * 3 : 1), G.feat.color);
    }
  }

  // the drivers
  const cd = B.cards, n = S.vans.length, cols = n > 1 ? 2 : 1, rows = Math.ceil(n / cols);

  // the shop

  if(sp[3] > 60){

}

  if(!qrCache || qrCache.url !== url) qrCache = {url, m: qrMatrix(url, 'M')};
  const m = qrCache.m, n = m.length, c = size / (n + 8);
  H.fillStyle = '#fff'; H.fillRect(x, y, size, size);
  H.fillStyle = '#000';
  for(let i = 0; i < n; i++) for(let j = 0; j < n; j++) if(m[i][j]) H.fillRect(x + (j + 4) * c, y + (i + 4) * c, Math.ceil(c), Math.ceil(c));

    if(!list.length && r !== 'none') txt(r === 'drive' ? 'computer' : r === 'arrange' ? 'computer (slow)' : r === 'grow' ? 'wholesale truck' : r === 'dispatch' ? 'automatic' : '-', cx + 6, cy + 24, 15, '#999', 'left', '500');
  });
  txt('Grandpa Quist grew up around this shop. Irene Watson started it selling roses door to door in 1927.', W - 40, Hh - 18, 14, 'rgba(255,255,255,0.65)', 'right', '500');
}

function drawResults(final){
  const S = G.S, r = S.results; if(!r) return;

  outlined('$' + S.money.toLocaleString(), VW / 2, y + 100, 64, '#7dff6b');

  const rows = [
    ['Bouquets delivered', r.delivered + (r.perfect ? '  (' + r.perfect + ' right on the porch)' : '')],

    ['Customers who gave up', r.cancelled], ['Gilbert Goons sent flying', r.goons + (r.stolen ? '  (' + r.stolen + ' bouquets swiped)' : '')]
  ];
  if(final) rows.push(['Parade cheers', S.cheers]);
  let yy = y + 190;
  rows.forEach(([a, b]) => { txt(a, x + 40, yy, 20, '#ddd', 'left', '500'); txt(String(b), x + W - 40, yy, 20, '#fff', 'right'); yy += 30; });
  if(r.best.crash) { txt('Crash of the day: ' + r.best.crash.name + ' at ' + Math.round(r.best.crash.imp * 2.237) + ' mph' + (r.best.crash.street ? ' on ' + r.best.crash.street : ''), x + 40, yy + 6, 18, '#ff9a9a', 'left', '500'); yy += 30; }
  yy += 10;
  r.awards.slice(0, Math.floor((y + h - yy - 50) / 28)).forEach(a => { txt(a.title, x + 40, yy, 18, '#f2c531'); txt(a.name + ' - ' + a.val, x + W - 40, yy, 18, '#fff', 'right', '500'); yy += 28; });
  txt(final ? 'Any phone: back to the shop' : 'The Gilbert Days Parade is next...', VW / 2, y + h - 24, 18, '#f7cfd6', 'center');
}
function drawParadeHud(){

  outlined('Gilbert Days Parade', VW / 2, 50, 44, '#f7cfd6');

/* ---------------- sound ---------------- */
let AC = null, master = null, muted = false, musicGain = null, engines = [];
function soundOn(){
  if(AC){ if(AC.state === 'suspended') AC.resume(); return; }
  try {
    if(navigator.audioSession) navigator.audioSession.type = 'playback';
    AC = new (window.AudioContext || window.webkitAudioContext)();
    master = AC.createGain(); master.gain.value = muted ? 0 : 0.6; master.connect(AC.destination);
    musicGain = AC.createGain(); musicGain.gain.value = 0.22; musicGain.connect(master);
    noiseBuf = AC.createBuffer(1, AC.sampleRate, AC.sampleRate);
    const d = noiseBuf.getChannelData(0); for(let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    startMusic();
  } catch(e){ AC = null; }
}
function toggleMute(){ muted = !muted; if(master) master.gain.value = muted ? 0 : 0.6; }
let noiseBuf = null;
function tone(f, d, type, vol, t0, slide){
  if(!AC) return;
  const t = AC.currentTime + (t0 || 0);
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type || 'sine'; o.frequency.setValueAtTime(f, t);
  if(slide) o.frequency.exponentialRampToValueAtTime(slide, t + d);
  g.gain.setValueAtTime(vol || 0.2, t); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
  o.connect(g); g.connect(master); o.start(t); o.stop(t + d + 0.05);
}
function noise(d, f, q, vol, t0, type, f2){
  if(!AC) return;
  const t = AC.currentTime + (t0 || 0);
  const s = AC.createBufferSource(); s.buffer = noiseBuf; s.loop = true;
  const fl = AC.createBiquadFilter(); fl.type = type || 'bandpass'; fl.frequency.setValueAtTime(f, t); fl.Q.value = q || 1;
  if(f2) fl.frequency.exponentialRampToValueAtTime(f2, t + d);
  const g = AC.createGain(); g.gain.setValueAtTime(vol || 0.3, t); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
  s.connect(fl); fl.connect(g); g.connect(master); s.start(t, Math.random()); s.stop(t + d + 0.05);
}
const sfxLast = {};
function sfx(k, v){
  if(!AC) return;
  const now = AC.currentTime;
  if(sfxLast[k] && now - sfxLast[k] < 0.05) return;
  sfxLast[k] = now;
  switch(k){
    case 'click': tone(880, 0.06, 'square', 0.06); break;
    case 'crash': noise(0.9, 900, 0.6, 0.7, 0, 'lowpass', 120); tone(70, 0.5, 'sine', 0.6, 0, 35); for(let i = 0; i < 6; i++) tone(1200 + Math.random() * 2400, 0.15, 'triangle', 0.08, 0.05 + Math.random() * 0.5); break;
    case 'thud': tone(90, 0.2, 'sine', 0.3, 0, 50); noise(0.15, 400, 1, 0.15); break;
    case 'bump': noise(0.12, 600, 1, Math.min(0.3, (v || 5) / 30)); break;
    case 'smash': noise(0.18, 1800, 1.5, 0.18); tone(300 + Math.random() * 300, 0.1, 'triangle', 0.08); break;
    case 'whoosh': noise(0.4, 400, 2, 0.25, 0, 'bandpass', 2400); break;
    case 'toss': noise(0.3, 600, 3, 0.15, 0, 'bandpass', 1800); break;
    case 'perfect': [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.25, 'triangle', 0.18, i * 0.07)); tone(2093, 0.4, 'sine', 0.08, 0.3); break;
    case 'porch': [523, 784].forEach((f, i) => tone(f, 0.22, 'triangle', 0.16, i * 0.08)); break;
    case 'lawn': tone(440, 0.25, 'triangle', 0.14); break;
    case 'miss': tone(330, 0.3, 'sawtooth', 0.1, 0, 300); tone(262, 0.5, 'sawtooth', 0.1, 0.3, 220); break;
    case 'load': [660, 880].forEach((f, i) => tone(f, 0.12, 'sine', 0.12, i * 0.06)); break;
    case 'mist': noise(0.8, 5000, 0.5, 0.08, 0, 'highpass'); break;
    case 'fuse': noise(1.2, 3000, 2, 0.12, 0, 'bandpass', 5000); break;
    case 'boom': tone(55, 1.2, 'sine', 0.8, 0, 28); noise(1.4, 500, 0.5, 0.8, 0, 'lowpass', 80); break;
    case 'splash': noise(0.9, 1200, 0.6, 0.5, 0, 'lowpass', 300); break;
    case 'goon': tone(600, 0.15, 'square', 0.08, 0, 900); tone(500, 0.3, 'square', 0.08, 0.15, 200); break;
    case 'bonk': tone(220, 0.15, 'square', 0.15, 0, 110); noise(0.1, 2000, 2, 0.15); break;
    case 'bell': [988, 1319].forEach((f, i) => tone(f, 0.5, 'sine', 0.12, i * 0.12)); break;
    case 'ding': tone(1568, 0.3, 'sine', 0.08); break;
    case 'cash': tone(2637, 0.08, 'square', 0.06); tone(3136, 0.25, 'sine', 0.08, 0.08); break;
    case 'rose': tone(1760, 0.15, 'sine', 0.05); break;
    case 'ping': tone(1200, 0.1, 'sine', 0.12); tone(1200, 0.1, 'sine', 0.12, 0.15); break;
    case 'cheer': for(let i = 0; i < 4; i++) noise(0.6, 1500 + Math.random() * 1500, 1, 0.08, i * 0.08); break;
  }
}
function cue(k){
  if(!AC) return;
  if(k === 'count') tone(660, 0.18, 'square', 0.12);
  if(k === 'go'){ tone(880, 0.5, 'square', 0.14); tone(1320, 0.5, 'square', 0.08); }
  if(k === 'goons'){ [392, 370, 349, 330].forEach((f, i) => tone(f, 0.2, 'sawtooth', 0.08, i * 0.15)); }
  if(k === 'haboob') noise(3, 200, 0.5, 0.3, 0, 'lowpass', 600);
  if(k === 'end') [523, 659, 784, 1047, 784, 1047].forEach((f, i) => tone(f, 0.3, 'triangle', 0.14, i * 0.14));
  if(k === 'cheer') sfx('cheer');
}
/* the engine: one hum, for whichever van the action cam is on */
function engineTick(){
  if(!AC) return;
  const S = G.S, v = S.vans[featured()];
  let e = engines[0];
  if(!e){
    const o = AC.createOscillator(), o2 = AC.createOscillator(), f = AC.createBiquadFilter(), g = AC.createGain();
    o.type = 'sawtooth'; o2.type = 'square'; o2.detune.value = 7; f.type = 'lowpass'; f.frequency.value = 600; g.gain.value = 0;
    o.connect(f); o2.connect(f); f.connect(g); g.connect(master); o.start(); o2.start();
    e = engines[0] = {o, o2, f, g};
  }
  const on = (G.phase === 'day' || G.phase === 'count') && v && !v.crash;
  const t = AC.currentTime, spd = v ? v.spd : 0;
  const base = 38 + spd * 2.4 + (v && v.boosting ? 35 : 0);
  e.o.frequency.setTargetAtTime(base, t, 0.05); e.o2.frequency.setTargetAtTime(base * 0.5, t, 0.05);
  e.f.frequency.setTargetAtTime(400 + spd * 30, t, 0.05);
  e.g.gain.setTargetAtTime(on ? 0.04 + (v.boosting ? 0.03 : 0) : 0, t, 0.08);
}

/* music: a little sequenced loop - a walking bass, a brushed beat and a
   twangy tune, written out here rather than recorded */
let musicState = 'lobby', musicStep = 0, musicNext = 0;
const SONGS = {
  lobby: {bpm: 96, bass: [45, 0, 52, 0, 50, 0, 52, 0, 43, 0, 50, 0, 48, 0, 50, 0], lead: [69, 0, 0, 72, 0, 74, 72, 0, 67, 0, 0, 0, 69, 0, 67, 64]},
  day: {bpm: 132, bass: [40, 40, 47, 40, 45, 45, 52, 45, 43, 43, 50, 43, 47, 47, 54, 47], lead: [64, 0, 67, 69, 0, 71, 69, 67, 64, 0, 62, 64, 0, 0, 59, 0]},
  parade: {bpm: 116, bass: [48, 0, 55, 0, 53, 0, 55, 0, 48, 0, 52, 0, 55, 0, 52, 0], lead: [72, 74, 76, 0, 79, 0, 76, 74, 72, 0, 69, 0, 72, 0, 0, 0]},
  results: {bpm: 100, bass: [48, 0, 52, 0, 55, 0, 52, 0, 53, 0, 57, 0, 55, 0, 52, 0], lead: [76, 0, 74, 0, 72, 0, 74, 76, 0, 79, 0, 76, 74, 0, 72, 0]}
};
function startMusic(){ musicNext = AC.currentTime + 0.1; }
function musicMode(m){ musicState = m; musicStep = 0; }
function mtof(n){ return 440 * Math.pow(2, (n - 69) / 12); }
function musicTick(){
  if(!AC || !musicGain) return;
  const song = SONGS[musicState] || SONGS.lobby;
  const step = 60 / song.bpm / 2;
  const hot = G.phase === 'day' && G.S.dust > 0.2;
  while(musicNext < AC.currentTime + 0.2){
    const t = musicNext, i = musicStep % 16;
    const b = song.bass[i];
    if(b) pluck(mtof(b - 12), step * 1.6, 'triangle', 0.5, t);
    const l = song.lead[i];
    if(l && (musicStep % 32 < 16 || musicState !== 'day' || i % 2 === 0)) pluck(mtof(l), step * 1.2, 'sawtooth', 0.12, t, true);
    if(i % 4 === 0) kick(t);
    if(i % 4 === 2) brush(t, 0.25);
    if(i % 2 === 1) brush(t, 0.08);
    if(hot && i % 8 === 0) brush(t, 0.2);
    musicStep++; musicNext += step;
  }
}
function pluck(f, d, type, vol, t, twang){
  const o = AC.createOscillator(), g = AC.createGain(), fl = AC.createBiquadFilter();
  o.type = type; o.frequency.setValueAtTime(f, t);
  if(twang){ o.frequency.setValueAtTime(f * 0.97, t); o.frequency.linearRampToValueAtTime(f, t + 0.05); }
  fl.type = 'lowpass'; fl.frequency.setValueAtTime(twang ? 2600 : 900, t); fl.frequency.exponentialRampToValueAtTime(300, t + d);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
  o.connect(fl); fl.connect(g); g.connect(musicGain); o.start(t); o.stop(t + d + 0.05);
}
function kick(t){ const o = AC.createOscillator(), g = AC.createGain(); o.frequency.setValueAtTime(110, t); o.frequency.exponentialRampToValueAtTime(40, t + 0.15); g.gain.setValueAtTime(0.6, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.2); o.connect(g); g.connect(musicGain); o.start(t); o.stop(t + 0.25); }
function brush(t, vol){ const s = AC.createBufferSource(); s.buffer = noiseBuf; const f = AC.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = 5000; const g = AC.createGain(); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.08); s.connect(f); f.connect(g); g.connect(musicGain); s.start(t, Math.random()); s.stop(t + 0.1); }

/* ---------------- go ---------------- */
resize();
openRoom();
setInterval(tick, 1000 / 60);
setInterval(broadcast, 100);
setInterval(sweep, 1000);
setInterval(worldTick, 50);
setInterval(() => { engineTick(); musicTick(); }, 50);
rebuildVans();
requestAnimationFrame(frame);
// for netcheck and the curious
window.WTV = {G, NET, M, startDay, startParade, toLobby, scene, renderer, V};
