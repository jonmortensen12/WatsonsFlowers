/* A phone that opens the link is a player, not the TV: straight to the phone
   page, which can join a room or open the shop itself. ?tv=1 keeps this page
   on any device (a tablet as the TV). */
(function(){
  var q = location.search, coarse = window.matchMedia && matchMedia('(pointer: coarse)').matches;
  if(coarse && Math.min(screen.width, screen.height) < 600 && !/[?&]tv=1/.test(q)) location.replace('controller.html' + q + location.hash);
})();
</script>

<script type="module">
import * as THREE from './lib/three.module.min.js';
import {buildWorld, makeSign, labelTex, canvas as mkCanvas, tex} from './world.js';
import {createView} from './view.js';

/* Watson's Flowers - the TV.

   Hosts the room, runs the simulation at 60 steps a second, and draws the
   town once for every driver (split screen, up to six vans), the shop's
   numbers across the top, and the lobby, results and parade.

   No phones? Press Enter to open the shop; the arrow keys drive van 1
   (Shift boosts, Space throws), the computer does everything else.
   ?local=1 plus controller.html?local=1#CODE in other tabs: phones
   without the internet. P pauses, M mutes, F fullscreen. */

const PROTO = 1, PROTO_MIN = 1;
const SIM = WSim, DT = SIM.DT;
const ROLES = ['drive', 'toss', 'arrange', 'grow', 'dispatch', 'cart'];
const ROLE_NAMES = {drive: 'Driver', toss: 'Tosser', arrange: 'Arranger', grow: 'Grower', dispatch: 'Dispatcher', cart: 'Rose cart'};
const HOLIDAYS = SIM.HOLIDAYS, HKEYS = SIM.HOLIDAY_KEYS;

/* ---------------- the host: the save, the room, the people, the day (host.js) ----------------
   The TV hosts, and draws and plays what happens; host.js does the rest, the
   same code a phone runs when there is no TV. */
const HOST = WHost.create({
  tv: true,
  room: () => { qrCache = null; },
  event: e => onEvent(e),
  phase: p => onPhase(p),
  vans: () => { syncVans(); G.S.vans.forEach((v, i) => refreshTag(i)); },
  map: m => onMap(m),
  ticker: (t, c) => ticker(t, c),
  sfx: k => sfx(k),
  kbdInput: () => kbdInput()
});
const G = HOST.G, NET = HOST.NET, SAVE = HOST.SAVE;
let M = HOST.M;
const startDay = HOST.startDay, startParade = HOST.startParade, toLobby = HOST.toLobby, tellAll = HOST.tellAll, storeSave = HOST.storeSave;
function setMap(k){ HOST.setMap(k); }
function controllerUrl(){
  const base = location.href.split('#')[0].split('?')[0].replace(/[^/]*$/, '');
  return base + 'controller.html' + (WNet.isLocal() ? '?local=1' : '') + '#' + NET.code;
}
/* what the TV does as the day moves on */
function onPhase(p){
  const ph = document.getElementById('playHere'); if(ph && p !== 'lobby') ph.classList.remove('lobby');
  if(p === 'count'){ rebuildVans(); clearFx(); musicMode('day'); }
  else if(p === 'end'){ musicMode('results'); cue('end'); }
  else if(p === 'parade'){ buildParade(); musicMode('parade'); }
  else if(p === 'results') cue('cheer');
  else if(p === 'lobby'){
    if(parade){ scene.remove(parade.grp); scene.remove(parade.crowd); parade = null; }
    rebuildVans(); clearFx(); musicMode('lobby');
  }
}

/* ---------------- keyboard ---------------- */
let kbSteer = 0;
function kbdInput(){
  const k = G.kbd;
  const want = (k.ArrowRight || k.KeyD ? 1 : 0) - (k.ArrowLeft || k.KeyA ? 1 : 0);
  kbSteer += Math.max(-DT * 5, Math.min(DT * 5, want - kbSteer));
  if(!want && Math.abs(kbSteer) < 0.05) kbSteer = 0;
  return {st: kbSteer, gas: k.ArrowUp || k.KeyW, brk: k.ArrowDown || k.KeyS, bst: k.ShiftLeft || k.ShiftRight};
}
addEventListener('keydown', e => {
  G.kbd[e.code] = true;
  soundOn();
  if(['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'KeyW', 'KeyA', 'KeyS', 'KeyD'].includes(e.code)){
    e.preventDefault();
    G.kbdDriver = true;
    const S = G.S;
    if(S.vans[0] && !S.vans[0].owner && (G.phase === 'day' || G.phase === 'count')){ SIM.setOwner(S, 0, 'kbd', 'Keyboard'); refreshTag(0); }
  }
  if(e.repeat) return;
  if(e.code === 'Enter'){
    if(G.phase === 'lobby') startDay();
    else if(G.phase === 'end') startParade();
    else if(G.phase === 'results') toLobby();
  }
  if(e.code === 'Space'){
    e.preventDefault();
    if(G.phase === 'day' && G.S.vans[0]) SIM.act(G.S, 'kbd', 'Keyboard', {a: 'toss', v: 0, ang: 0, pow: 0.5, auto: true});
    if(G.phase === 'parade') SIM.act(G.S, 'kbd', 'Keyboard', {a: 'ptoss', ang: Math.random() < 0.5 ? Math.PI / 2 : -Math.PI / 2, pow: 0.5});
  }
  if(e.code === 'KeyP' && G.phase === 'day'){ G.paused = !G.paused; G.S.paused = G.paused; }
  if(e.code === 'KeyM') toggleMute();
  if(e.code === 'KeyF'){ if(document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen().catch(() => {}); }
  if(e.code === 'KeyT' && G.phase === 'lobby'){ const ks = WMap.TOWNS.map(q => q.k); setMap(ks[(ks.indexOf(M.key) + 1) % ks.length]); }
  if(e.code === 'KeyH' && G.phase === 'lobby') HOST.setHoliday(HKEYS[(HKEYS.indexOf(SAVE.holiday) + 1) % HKEYS.length]);
});
addEventListener('keyup', e => { G.kbd[e.code] = false; });
addEventListener('blur', () => { G.kbd = {}; });
addEventListener('pointerdown', () => soundOn());

/* ---------------- three.js: the action cam, the lobby, the parade ---------------- */
const glc = document.getElementById('gl');
// ?norender=1: run everything but the 3D drawing (netcheck, on a machine with no GPU)
const NORENDER = /(^|[?&])norender=1(&|$)/.test(location.search);
const renderer = new THREE.WebGLRenderer({canvas: glc, antialias: true, powerPreference: 'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.autoClear = false;
const scene = new THREE.Scene();
let world = buildWorld(scene, M);
let V = createView(scene, M);
/* the town, swapped in the lobby: everything in the scene is the town's,
   so it all goes and the new town is built in its place */
function onMap(m){
  M = m;
  scene.traverse(o => { if(o.geometry) o.geometry.dispose(); if(o.material) [].concat(o.material).forEach(q => { if(q.map) q.map.dispose(); q.dispose(); }); });
  while(scene.children.length) scene.remove(scene.children[0]);
  world = buildWorld(scene, M);
  V = createView(scene, M);
  pingObjs.length = 0; parade = null; mapCache = null; brokenShown = {};
  rebuildVans();
}
const hud = document.getElementById('hud'), H = hud.getContext('2d');
let VW = 0, VH = 0, DPR = 1;
function resize(){
  DPR = Math.min(devicePixelRatio, 1.5);
  VW = innerWidth; VH = innerHeight;
  renderer.setSize(VW, VH, false);
  hud.width = Math.round(VW * DPR); hud.height = Math.round(VH * DPR);
  mapCache = null;
}
addEventListener('resize', resize);
WBouquet.load(() => { bqCache = {}; rebuildVans(); });

/* vans, as the view draws them */
function syncVans(){
  G.S.vans.forEach((v, i) => V.van(i, v.color, v.name));
}
function refreshTag(i){ const v = G.S.vans[i]; if(v) V.tag(i, v.name); }
function rebuildVans(){ V.dropAll(); syncVans(); }
let brokenShown = {};
function clearFx(){
  V.clear();
  M.props.forEach((p, i) => world.setProp(i, true));
  brokenShown = {};
  G.feat = null;
}

/* ---------------- pings from dispatch ---------------- */
const pingObjs = [];
function drawPings(S, t){
  S.pings.forEach((p, i) => {
    let o = pingObjs[i];
    if(!o){
      o = new THREE.Mesh(new THREE.CylinderGeometry(2, 2, 80, 12, 1, true).translate(0, 40, 0), new THREE.MeshBasicMaterial({color: '#ff3a3a', transparent: true, opacity: 0.3, depthWrite: false, side: THREE.DoubleSide}));
      scene.add(o); pingObjs[i] = o;
    }
    o.visible = true; o.position.set(p.x, 0, p.z);
    o.material.opacity = 0.2 + 0.15 * Math.sin(t * 8);
  });
  for(let i = S.pings.length; i < pingObjs.length; i++) pingObjs[i].visible = false;
}

/* ---------------- the parade ---------------- */
let parade = null;
function buildParade(){
  const S = G.S, Pd = S.parade, l = M.gilbertLine;
  const grp = new THREE.Group();
  const truck = new THREE.Mesh(new THREE.BoxGeometry(2.2, 1.8, 5), new THREE.MeshLambertMaterial({color: '#e8e8e8'}));
  truck.position.set(0, 1.2, 8); grp.add(truck);
  const deck = new THREE.Mesh(new THREE.BoxGeometry(4.4, 1.2, 10), new THREE.MeshLambertMaterial({color: '#f2a7b4'}));
  deck.position.set(0, 1.2, -1); grp.add(deck);
  // the float is heaped with the real flowers
  const keys = ['rose', 'sunflower', 'mum', 'lily', 'carnation', 'daisy'];
  for(let i = 0; i < 46; i++){
    const im = WBouquet.img[keys[i % keys.length]];
    if(!im || !im.naturalWidth) continue;
    const t = new THREE.Texture(im); t.needsUpdate = true; t.colorSpace = THREE.SRGBColorSpace;
    const sp = new THREE.Sprite(new THREE.SpriteMaterial({map: t, transparent: true}));
    sp.scale.set(1.1, 1.1 * im.naturalHeight / im.naturalWidth, 1);
    sp.position.set((Math.random() - 0.5) * 4, 2.1 + Math.random() * 0.5, -1 + (Math.random() - 0.5) * 9.4);
    grp.add(sp);
  }
  const sign = makeSign(world.signTex); sign.scale.setScalar(0.32); sign.rotation.y = Math.PI / 2; sign.position.set(0, 1.6, -4.5); grp.add(sign);
  const girl = new THREE.Group();
  const dress = new THREE.Mesh(new THREE.ConeGeometry(0.45, 1.1, 12), new THREE.MeshLambertMaterial({color: '#ffffff'})); dress.position.y = 0.55; girl.add(dress);
  const head = new THREE.Mesh(new THREE.SphereGeometry(0.22, 12, 10), new THREE.MeshLambertMaterial({color: '#f0c8a0'})); head.position.y = 1.3; girl.add(head);
  const hair = new THREE.Mesh(new THREE.SphereGeometry(0.24, 12, 10, 0, Math.PI * 2, 0, Math.PI * 0.6), new THREE.MeshLambertMaterial({color: '#7a4a24'})); hair.position.y = 1.33; girl.add(hair);
  const crown = new THREE.Mesh(new THREE.TorusGeometry(0.2, 0.05, 6, 12).rotateX(Math.PI / 2), new THREE.MeshLambertMaterial({color: '#f7cfd6'})); crown.position.y = 1.5; girl.add(crown);
  const arm = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.6, 0.1), new THREE.MeshLambertMaterial({color: '#f0c8a0'})); arm.position.set(0.3, 1.2, 0); girl.add(arm);
  girl.position.set(0, 1.85, 1.5); grp.add(girl);
  grp.userData = {arm, girl};
  scene.add(grp);
  const people = [];
  for(let z = Pd.z0 - 10; z < Pd.z0 + Pd.speed * Pd.dur + 40; z += 1.6) [-1, 1].forEach(sd => {
    if(Math.random() < 0.25) return;
    people.push({x: l.p + sd * (l.w / 2 + 2.5 + Math.random() * 5), z: z + Math.random(), c: Math.floor(Math.random() * 8), h: 1.4 + Math.random() * 0.5, j: 0});
  });
  const crowd = new THREE.InstancedMesh(new THREE.CapsuleGeometry(0.3, 1, 4, 8).translate(0, 0.8, 0), new THREE.MeshLambertMaterial({color: '#fff'}), people.length);
  const SHIRT = ['#c8312f', '#2f5fc8', '#f2c531', '#2f8a4c', '#f2f2f2', '#ef7fa6', '#8a4fc4', '#e8781e'];
  const c = new THREE.Color();
  people.forEach((p, i) => { crowd.setColorAt(i, c.set(SHIRT[p.c])); });
  scene.add(crowd);
  parade = {grp, crowd, people, cam: new THREE.PerspectiveCamera(60, 1, 0.8, 6000)};
}
const _pm = new THREE.Matrix4();
function drawParade(dt, t){
  if(!parade) return;
  const Pd = G.S.parade;
  parade.grp.position.set(Pd.x, 0, Pd.z);
  parade.grp.userData.arm.rotation.z = Math.sin(t * 8) * 0.6;
  parade.people.forEach((p, i) => {
    p.j = Math.max(0, p.j - dt * 2);
    const hop = Math.abs(Math.sin(t * 10 + i)) * p.j * 0.8;
    _pm.makeScale(1, p.h / 1.6, 1).setPosition(p.x, hop, p.z);
    parade.crowd.setMatrixAt(i, _pm);
  });
  parade.crowd.instanceMatrix.needsUpdate = true;
}
function cheerNear(x, z){ if(parade) parade.people.forEach(p => { if(Math.hypot(p.x - x, p.z - z) < 6) p.j = 1; }); }

/* ---------------- events from the simulation ---------------- */
function vanName(i){ const v = G.S.vans[i]; return v ? v.name : 'A van'; }
function nameOf(id){ const p = NET.people[id] || G.S.ppl[id]; return p ? p.name : 'Someone'; }
function ticker(text, color){ G.ticker.push({text, color: color || '#fff', t: 0}); if(G.ticker.length > 6) G.ticker.shift(); }
/* the action cam goes where the action is */
function feature(i, secs, why, color){
  const S = G.S; if(!S.vans[i]) return;
  if(G.feat && G.feat.until > wallT && G.feat.prio > secs && G.feat.i !== i) return;
  G.feat = {i, until: wallT + secs, why, color: color || '#fff', prio: secs, t0: wallT};
}
function onEvent(e){
  const S = G.S;
  if(!NORENDER){ V.holiday = S.holiday; V.event(e); }
  switch(e.k){
    case 'count': cue('count'); break;
    case 'go': cue('go'); ticker("Watson's is open!", '#f2c531'); break;
    case 'crash':
      feature(e.v, 5, e.cause === 'canal' ? 'IN THE CANAL!' : 'CRASH!', '#ff5a5a');
      sfx(e.cause === 'canal' ? 'splash' : 'crash', e.imp);
      if(e.kaboom) sfx('boom');
      ticker(vanName(e.v) + ' crashed' + (e.cause === 'canal' ? ' into the canal' : '') + (e.lost.length ? ' - ' + e.lost.length + ' bouquets everywhere' : ''), '#ff8a8a');
      mapFx.push({x: e.x, z: e.z, t: 0, k: 'crash', n: e.lost.length});
      break;
    case 'thud': sfx('thud'); break;
    case 'bump': sfx('bump', e.imp); break;
    case 'smash': world.setProp(e.p, false); brokenShown[e.p] = true; sfx('smash'); break;
    case 'wall': world.setWall(e.b, false); sfx('wall'); break;
    case 'dent': sfx('dent'); break;
    case 'carhit': sfx('carhit', e.big > 0.6); if(e.boom) sfx('boom'); break;
    case 'carbounce': sfx('carbounce'); break;
    case 'near': feature(e.v, 1.6, 'NEAR MISS!', '#7fe0ff'); sfx('whoosh'); break;
    case 'land':
      if(e.how){
        const vv = e.v;
        if(e.how === 'miss'){ sfx('miss'); ticker((e.who ? nameOf(e.who) : vanName(vv)) + ' missed the porch', '#ff8a8a'); }
        else {
          sfx(e.how === 'perfect' ? 'perfect' : e.how === 'porch' ? 'porch' : 'lawn');
          if(e.how === 'perfect') feature(vv, 2.5, 'ON THE PORCH!  $' + e.pay, '#7dff6b');
          ticker((e.who && e.who !== (S.vans[vv] && S.vans[vv].owner) ? nameOf(e.who) : vanName(vv)) + ' delivered to ' + e.cust + ' - $' + e.pay, '#b8ffb0');
          mapFx.push({x: e.x, z: e.z, t: 0, k: 'paid', pay: e.pay});
        }
      } else if(e.air > 1){ feature(e.v, 3, e.air.toFixed(1) + 's OF AIR!', '#ffd23f'); sfx('thud'); }
      break;
    case 'toss': sfx('toss'); break;
    case 'nothing': break;
    case 'load': sfx('load'); break;
    case 'mist': sfx('mist'); break;
    case 'ice': sfx('load'); break;
    case 'powder': sfx('fuse'); feature(e.v, 4, 'BLACK POWDER!', '#ff7a1a'); break;
    case 'boom':
      sfx('boom'); sfx('splash');
      feature(e.v, 6, "GRANDPA'S CANAL BLAST!", '#ff7a1a');
      ticker(e.name + " set off Grandpa's black powder at the canal. Just like 1950-something.", '#ffb27a');
      mapFx.push({x: e.x, z: e.z, t: 0, k: 'boom'});
      break;
    case 'goons': ticker('School is out. The Gilbert Goons are on their scooters.', '#ffb3b3'); cue('goons'); break;
    case 'gooned': feature(e.v, 3, 'GOONED! ' + e.name + ' took a bouquet', '#ff5a5a'); sfx('goon'); ticker(e.name + ' swiped a bouquet off ' + vanName(e.v), '#ff8a8a'); break;
    case 'goonhit': feature(e.v, 2.5, e.rec ? 'GOT IT BACK!' : 'GOON DOWN!', '#7dff6b'); sfx('bonk'); break;
    case 'getaway': ticker(e.name + ' got away with a bouquet', '#ff8a8a'); break;
    case 'splash': sfx('splash'); break;
    case 'haboob': ticker('HABOOB! A wall of dust is rolling in off the desert', '#e0b07a'); cue('haboob'); break;
    case 'rush': ticker('RUSH: ' + e.n + ' orders at once!', '#f2c531'); sfx('bell'); break;
    case 'ready': if(e.who) ticker(nameOf(e.who) + ' finished an arrangement - ' + Math.round(e.q * 100) + '%', '#f7cfd6'); sfx('ding'); break;
    case 'walkin': ticker(nameOf(e.who) + ' sold a walk-in bouquet, $' + e.pay, '#f7cfd6'); sfx('cash'); break;
    case 'cancel': if(e.kind === 'del') ticker(e.who + ' gave up waiting and cancelled', '#ff8a8a'); break;
    case 'rose': ticker(e.name + ' sold a rose', '#ff9ab0'); sfx('rose'); break;
    case 'harvest': ticker(nameOf(e.who) + ' cut ' + SIM.FLOWERS[e.f].name.toLowerCase() + ' from the garden', '#b8ffb0'); break;
    case 'ping': ticker('Dispatch: ' + (e.kind === 'goon' ? 'goons spotted!' : 'look here!'), '#ff8a8a'); sfx('ping'); break;
    case 'assign': ticker('Dispatch sent ' + vanName(e.v) + ' a priority order', '#f2c531'); break;
    case 'parade': ticker('The Gilbert Days Parade! Everybody: swipe to throw flowers to the crowd', '#f7cfd6'); cue('cheer'); break;
    case 'ptoss': sfx('toss'); break;
    case 'pland': if(e.hit){ cheerNear(e.x, e.z); sfx('cheer'); } break;
  }
}

/* ---------------- drawing ---------------- */
const overview = new THREE.PerspectiveCamera(50, 1, 1, 6000);
const actionCam = new THREE.PerspectiveCamera(66, 16 / 9, 0.8, 6000);
let frameT = performance.now(), wallT = 0, frameDt = 1 / 60;
const mapFx = [];
function frame(){
  requestAnimationFrame(frame);
  const now = performance.now(), dt = Math.min(0.1, (now - frameT) / 1000);
  frameT = now; wallT += dt; frameDt = dt;
  const S = G.S;
  const alpha = HOST.alpha();
  const hour = G.phase === 'lobby' ? 19.2 : G.phase === 'parade' || G.phase === 'results' ? 19.6 : G.phase === 'end' ? 20 : S.clock;
  const dust = G.phase === 'day' || G.phase === 'end' ? S.dust : 0;
  const wind = {x: S.gust.x * dust * 2, z: S.gust.z * dust * 2};

  if(!NORENDER){
    V.traffic(S.cars);
    V.goons(S.goons.filter(g => g.st !== 'gone'), wallT);
    V.tick(dt, wind);
    drawPings(S, wallT);
    drawParade(dt, wallT);
    world.updateLights(S);
    world.updatePickups(S, wallT);
    if(Math.random() < 0.05) Object.keys(brokenShown).forEach(id => { if(!S.broken[id]){ world.setProp(+id, true); delete brokenShown[id]; } });
    if(Math.random() < 0.05) world.syncWalls(S.wallsDown);
    S.vans.forEach((v, i) => {
      const o = V.van(i, v.color, v.name);
      const x = v.px != null ? v.px + (v.x - v.px) * alpha : v.x, z = v.pz != null ? v.pz + (v.z - v.pz) * alpha : v.z;
      const y = v.py != null ? v.py + (v.y - v.py) * alpha : v.y;
      let h = v.h; if(v.ph != null){ let d = v.h - v.ph; d = Math.atan2(Math.sin(d), Math.cos(d)); h = v.ph + d * alpha; }
      v.rx = x; v.rz = z; v.ry = y; v.rh = h;
      V.placeVan(i, {x, y, z, h, crash: v.crash, boosting: v.boosting, powder: v.powder > 0, drift: v.drift, spd: v.spd, ghost: v.ghost > 0 && G.phase === 'day', yaw: v.yaw, air: v.air > 0.3, vy: v.vy, vx: v.vx, vz: v.vz}, dt, wallT);
      V.target(i, G.phase === 'day' ? SIM.targetPoint(S, v) : null, wallT);
      V.route(i, G.phase === 'day' ? v.route : null);
    });
  }

/* which van the action cam is on */
function featured(){

    else if(f.k === 'boom'){ H.strokeStyle = '#ff7a1a'; H.lineWidth = 5; H.beginPath(); H.arc(x, y, 10 + u * 60, 0, Math.PI * 2); H.stroke(); outlined('KABOOM!', x, y - 20, 18, '#ff7a1a'); }
    H.globalAlpha = 1;
  }
  // the haboob rolls in from the southeast
  if(S.dust > 0.02){
    const gr = H.createLinearGradient(ms.x0 + ms.w, ms.y0 + ms.h, ms.x0, ms.y0);
    gr.addColorStop(0, 'rgba(150,105,60,' + (0.6 * S.dust) + ')'); gr.addColorStop(Math.min(1, S.dust * 1.2), 'rgba(150,105,60,' + (0.35 * S.dust) + ')'); gr.addColorStop(1, 'rgba(150,105,60,0)');
    H.fillStyle = gr; H.fillRect(ms.x0, ms.y0, ms.w, ms.h);
  }
  // the heat: a shimmer of orange at the top as it climbs
  const heat = SIM.heat01(S);
  if(heat > 0.5){ H.fillStyle = 'rgba(255,120,40,' + ((heat - 0.5) * 0.18) + ')'; H.fillRect(ms.x0, ms.y0, ms.w, ms.h); }
  H.restore();
  labelBox = null;
  // the legend, above the map
  const ly = Math.max(r[1] + 12, ms.y0 - 14);
  txt(M.name, ms.x0 + 4, ly, 14, '#f2c531');
  txt('●  ready at the shop', ms.x0 + 140, ly, 12, '#ff6fa6');
  txt('◉  in a van, on its way', ms.x0 + 290, ly, 12, '#fff');
  txt('G  Gilbert Goon', ms.x0 + 460, ly, 12, '#ff8a8a');

  // the action cam's frame and caption
  const c = B.cam, fi = featured(), fv = S.vans[fi];
  H.strokeStyle = fv ? fv.color : '#fff'; H.lineWidth = 3; H.strokeRect(c[0], c[1], c[2], c[3]);
  if(NORENDER){ H.fillStyle = '#222'; H.fillRect(c[0], c[1], c[2], c[3]); }
  if(fv){
    panel(c[0] + 8, c[1] + 8, Math.min(c[2] - 16, 420), 30, 0.6);
    txt('ACTION CAM  ·  ' + fv.name + '  ·  ' + Math.round(fv.spd * 2.237) + ' mph' + (fv.street ? '  ·  ' + fv.street : ''), c[0] + 18, c[1] + 23, 14, '#fff');
    if(G.feat && G.feat.i === fi && G.feat.until > wallT){
      const u = wallT - G.feat.t0;
      outlined(G.feat.why, c[0] + c[2] / 2, c[1] + c[3] * 0.32, Math.min(46, c[2] / 14) * (u < 0.15 ? 1 + (0.15 - u) * 3 : 1), G.feat.color);
    }
  }

  // the drivers
  const cd = B.cards, n = S.vans.length, cols = n > 1 ? 2 : 1, rows = Math.ceil(n / cols);
  const cw = (cd[2] - (cols - 1) * 8) / cols, chh = Math.min(92, (cd[3] - (rows - 1) * 6) / rows);
  S.vans.forEach((v, i) => {
    const x = cd[0] + (i % cols) * (cw + 8), y = cd[1] + Math.floor(i / cols) * (chh + 6);
    panel(x, y, cw, chh, 0.78);
    H.fillStyle = v.color; H.fillRect(x, y + 8, 5, chh - 16);
    txt(v.name + (v.remote ? '' : v.owner === 'kbd' ? ' (keyboard)' : ' (computer)'), x + 14, y + 16, 15, '#fff');
    txt(Math.round(v.spd * 2.237) + ' mph', x + cw - 10, y + 16, 15, v.boosting ? '#7fd0ff' : '#ddd', 'right');
    // the dents
    const dm = v.dmg || 0;
    H.fillStyle = 'rgba(255,255,255,0.12)'; H.fillRect(x + cw - 70, y + 30, 58, 6);
    H.fillStyle = dm > 0.75 ? '#ff4a3a' : dm > 0.4 ? '#ffb23a' : '#9ad06a'; H.fillRect(x + cw - 70, y + 30, 58 * dm, 6);
    txt('damage', x + cw - 74, y + 33, 10, '#aaa', 'right', '600');
    // the bouquets aboard, drawn from the real flowers
    const bw = Math.min(34, (cw - 20) / 6 - 2);
    for(let k = 0; k < SIM.CAP; k++){
      const bx = x + 12 + k * (bw + 3), by = y + 28;
      H.fillStyle = 'rgba(255,255,255,0.07)'; H.fillRect(bx, by, bw, bw * 1.2);
      const o = v.cargo[k] != null && SIM.orderById(S, v.cargo[k]);
      if(o){
        H.drawImage(orderPic(o, 60), bx, by, bw, bw * 1.3);
        H.fillStyle = o.fresh > 0.6 ? '#7dff6b' : o.fresh > 0.3 ? '#ffd23f' : '#ff6a3a';
        H.fillRect(bx, by + bw * 1.2 + 1, bw * o.fresh, 3);
      }
    }
    let status;
    if(v.crash) status = [v.crash.cause === 'wrecked' ? 'WRECKED! Patching it up...' : 'CRASHED!', '#ff6a6a'];
    else if(v.tgt){
      const tp = SIM.targetPoint(S, v), d = tp ? Math.round(Math.hypot(tp.x - v.x, tp.z - v.z)) : 0;
      status = v.tgt.k === 'house' ? ['→ ' + M.houses[v.tgt.id].addr + '  ' + d + ' m', '#f7cfd6'] : ['→ ' + M.shops[v.tgt.id].name + '  ' + d + ' m', '#ffe6a0'];
    } else status = ['', '#fff'];
    txt(status[0], x + 12, y + chh - 10, 12, status[1], 'left', '600');
  });

  // the shop
  const sp = B.shop;
  if(sp[3] > 60){
    panel(sp[0], sp[1], sp[2], sp[3], 0.78);
    txt("In the shop", sp[0] + 12, sp[1] + 16, 16, '#f2c531');
    let wait = 0; S.orders.forEach(o => { if(o.state === 'new') wait++; });
    txt(wait + ' waiting to be made  ·  ' + S.roses + ' roses sold from the cart', sp[0] + sp[2] - 12, sp[1] + 16, 12, '#ddd', 'right', '600');
    const ready = S.orders.filter(o => o.state === 'ready'), bench = S.orders.filter(o => o.state === 'arr' && o.arr);
    const ph = Math.max(40, Math.min(110, sp[3] - 56)), pw = ph / 1.3;
    let x = sp[0] + 12;
    if(bench.length){
      txt('On the bench', sp[0] + 12, sp[1] + 36, 12, '#f7cfd6');
      bench.slice(0, 3).forEach(o => {
        H.drawImage(benchPic(o, 90), x, sp[1] + 44, pw, ph);
        txt(nameOf(o.by), x + pw / 2, sp[1] + 44 + ph + 8, 11, '#fff', 'center', '600');
        x += pw + 8;
      });
      x += 10;
    }
    txt('In the cooler' + (ready.length ? '' : ' - empty'), x, sp[1] + 36, 12, '#9fe8ff');
    ready.slice(0, Math.floor((sp[0] + sp[2] - x) / (pw * 0.75))).forEach((o, k) => {
      H.drawImage(orderPic(o, 90), x + k * pw * 0.75, sp[1] + 44, pw, ph);
    });
    if(S.roles.grow > 0){
      const gy = sp[1] + sp[3] - 12;
      txt("Irene's garden", sp[0] + 12, gy, 11, '#b8ffb0');
      S.garden.forEach((p, k) => { H.fillStyle = p.water < 0.25 ? '#c0703a' : p.grow >= 1 ? '#7dff6b' : '#4ab0ff'; H.beginPath(); H.arc(sp[0] + 110 + k * 14, gy, 5, 0, Math.PI * 2); H.fill(); });
    }
  }
}

/* the lobby: the sign, the code, who is doing what */
let qrCache = null;
function drawQR(x, y, size){
  const url = controllerUrl();
  if(!qrCache || qrCache.url !== url) qrCache = {url, m: qrMatrix(url, 'M')};
  const m = qrCache.m, n = m.length, c = size / (n + 8);
  H.fillStyle = '#fff'; H.fillRect(x, y, size, size);
  H.fillStyle = '#000';
  for(let i = 0; i < n; i++) for(let j = 0; j < n; j++) if(m[i][j]) H.fillRect(x + (j + 4) * c, y + (i + 4) * c, Math.ceil(c), Math.ceil(c));
}
function drawLobby(){
  const ph = document.getElementById('playHere');
  if(ph && !ph.classList.contains('lobby')){ ph.classList.add('lobby'); ph.href = 'controller.html' + (WNet.isLocal() ? '?local=1' : ''); }
  const W = VW, Hh = VH, u = Math.max(0.55, Math.min(W / 1600, Hh / 900)), pad = Math.round(24 * u);
  const fit = (t, maxW) => { if(H.measureText(t).width <= maxW) return t; while(t.length > 1 && H.measureText(t + '…').width > maxW) t = t.slice(0, -1); return t + '…'; };
  // the join code: a card on the right
  const q = Math.round(Math.min(Hh * 0.34, W * 0.2));
  const qx = W - pad - q - 20 * u, qy = pad;
  panel(qx - 20 * u, qy, q + 40 * u, q + 96 * u, 0.82);
  if(NET.code){
    drawQR(qx, qy + 20 * u, q);
    txt('Scan to join', qx + q / 2, qy + q + 44 * u, Math.round(20 * u), '#fff', 'center');
    txt('code ' + NET.code, qx + q / 2, qy + q + 74 * u, Math.round(26 * u), '#f2c531', 'center');
  } else txt(NET.status, qx + q / 2, qy + q / 2, Math.round(16 * u), '#fff', 'center');
  // the sign, in its own colours, to the left
  const lw = Math.min(qx - 2 * pad - 20 * u, 640 * u), lh = lw * 0.2;
  const ly = pad + lh * 0.55;
  H.fillStyle = '#f2a7b4'; roundRect(H, pad, ly, lw, lh, 12 * u); H.fill();
  H.strokeStyle = '#d97a8c'; H.lineWidth = 6 * u; H.stroke();
  H.font = '900 ' + Math.round(lh * 0.62) + 'px "Arial Black", Impact, sans-serif'; H.textAlign = 'center'; H.textBaseline = 'middle';
  H.lineWidth = 7 * u; H.strokeStyle = '#7a4a10'; H.strokeText('FLOWERS', pad + lw / 2, ly + lh * 0.55); H.fillStyle = '#f2c531'; H.fillText('FLOWERS', pad + lw / 2, ly + lh * 0.55);
  const ox = pad + lw * 0.28, oy = ly, orx = lw * 0.19, ory = lh * 0.42;
  H.fillStyle = '#1b1b1b'; H.beginPath(); H.ellipse(ox, oy, orx, ory, -0.05, 0, Math.PI * 2); H.fill();
  H.fillStyle = '#f6f3ea'; H.beginPath(); H.ellipse(ox, oy, orx * 0.93, ory * 0.84, -0.05, 0, Math.PI * 2); H.fill();
  H.fillStyle = '#151515'; H.font = 'italic bold ' + Math.round(ory * 1.2) + 'px "Brush Script MT", "Segoe Script", cursive'; H.fillText("Watson's", ox, oy + ory * 0.1);
  let y = ly + lh + 30 * u;
  txt('Mesa & Gilbert, Arizona  ·  The Best Since 1927', pad + 4 * u, y, Math.round(19 * u), '#fff');
  // today
  y += 24 * u;
  const hol = HOLIDAYS[SAVE.holiday], tw = lw, th = 96 * u;
  panel(pad, y, tw, th, 0.72);
  txt('Today: ' + hol.name, pad + 18 * u, y + 26 * u, Math.round(24 * u), '#f2c531');
  H.font = '500 ' + Math.round(17 * u) + 'px system-ui'; txt(fit(hol.blurb, tw - 36 * u), pad + 18 * u, y + 54 * u, Math.round(17 * u), '#f7cfd6', 'left', '500');
  const rec = SAVE.records[SAVE.holiday] || 0;
  txt('Town: ' + WMap.townInfo(M.key).name + (rec ? '   ·   Family record: $' + rec.toLocaleString() : ''), pad + 18 * u, y + 80 * u, Math.round(15 * u), '#ccc', 'left', '500');
  // the crew, by job, across the bottom
  // just tall enough for the longest list, at the bottom, so the sign shows
  const ppl = Object.values(NET.people);
  const counts = {}; ppl.forEach(p => { const r = p.role || 'none'; counts[r] = (counts[r] || 0) + 1; });
  const longest = Math.max(1, ...Object.values(counts));
  const bottom = Hh - pad - (WSound.on() ? 0 : 52);
  const minTop = Math.max(y + th, qy + q + 96 * u) + pad;
  const ch = Math.max(90 * u, Math.min(bottom - minTop, (78 + Math.min(longest, 8) * 24) * u));
  const top = bottom - ch;
  if(ch < 80 * u) return;
  panel(pad, top, W - 2 * pad, ch, 0.72);
  txt(ppl.length ? 'Pick a job on your phone, then press START on any phone' : 'Join with your phone. No phones? Press Enter and drive with the arrow keys.', pad + 20 * u, top + 26 * u, Math.round(19 * u), '#fff');
  const by = {};
  ppl.forEach(p => { (by[p.role || 'none'] = by[p.role || 'none'] || []).push(p); });
  const cols = ['drive', 'toss', 'arrange', 'grow', 'dispatch', 'cart'];
  if(by.none) cols.push('none');
  const n = cols.length, cw = (W - 2 * pad - 40 * u) / n, rowH = Math.round(24 * u);
  const maxRows = Math.max(1, Math.floor((ch - 72 * u) / rowH));
  cols.forEach((r, i) => {
    const cx = pad + 20 * u + i * cw, cy = top + 64 * u, list = by[r] || [];
    H.font = 'bold ' + Math.round(18 * u) + 'px system-ui';
    txt(fit(r === 'none' ? 'Choosing...' : ROLE_NAMES[r] + (r === 'drive' ? 's' : r === 'cart' ? '' : 's'), cw - 12 * u), cx, cy, Math.round(18 * u), r === 'none' ? '#aaa' : '#f2c531');
    H.font = '500 ' + Math.round(17 * u) + 'px system-ui';
    list.slice(0, list.length > maxRows ? maxRows - 1 : maxRows).forEach((p, k) => txt(fit((p.conn ? '' : '(away) ') + p.name, cw - 16 * u), cx + 4 * u, cy + rowH * (k + 1.1), Math.round(17 * u), p.conn ? '#fff' : '#888', 'left', '500'));
    if(list.length > maxRows) txt('+' + (list.length - maxRows + 1) + ' more', cx + 4 * u, cy + rowH * (maxRows + 0.1), Math.round(15 * u), '#ccc', 'left', '500');
    if(!list.length && r !== 'none') txt(r === 'drive' ? 'the computer' : r === 'arrange' ? 'computer (slow)' : r === 'grow' ? 'wholesale truck' : r === 'dispatch' ? 'automatic' : '-', cx + 4 * u, cy + rowH * 1.1, Math.round(15 * u), '#999', 'left', '500');
  });
}

function drawResults(final){
  const S = G.S, r = S.results; if(!r) return;
  const W = Math.min(900, VW - 60), x = (VW - W) / 2, y = 70, h = VH - 140;
  panel(x, y, W, h, 0.82);
  outlined(final ? 'What a day!' : '8:00 PM - closing time', VW / 2, y + 40, 40, '#f2c531');
  outlined('$' + S.money.toLocaleString(), VW / 2, y + 100, 64, '#7dff6b');
  if(G.recordNew) outlined('NEW FAMILY RECORD!', VW / 2, y + 150, 28, '#ff9ab0');
  const rows = [
    ['Bouquets delivered', r.delivered + (r.perfect ? '  (' + r.perfect + ' right on the porch)' : '')],
    ['Walk-ins sold', r.walkins], ['Roses from the cart', r.roses], ['Crashes', r.crashes + '  (insurance: $' + r.damage.toLocaleString() + ')'],
    ['Customers who gave up', r.cancelled], ['Gilbert Goons sent flying', r.goons + (r.stolen ? '  (' + r.stolen + ' bouquets swiped)' : '')]
  ];
  if(final) rows.push(['Parade cheers', S.cheers]);
  let yy = y + 190;
  rows.forEach(([a, b]) => { txt(a, x + 40, yy, 20, '#ddd', 'left', '500'); txt(String(b), x + W - 40, yy, 20, '#fff', 'right'); yy += 30; });
  if(r.best.crash) { txt('Crash of the day: ' + r.best.crash.name + ' at ' + Math.round(r.best.crash.imp * 2.237) + ' mph' + (r.best.crash.street ? ' on ' + r.best.crash.street : ''), x + 40, yy + 6, 18, '#ff9a9a', 'left', '500'); yy += 30; }
  yy += 10;
  r.awards.slice(0, Math.floor((y + h - yy - 50) / 28)).forEach(a => { txt(a.title, x + 40, yy, 18, '#f2c531'); txt(a.name + ' - ' + a.val, x + W - 40, yy, 18, '#fff', 'right', '500'); yy += 28; });
  txt(final ? 'Any phone: back to the shop' : 'The Gilbert Days Parade is next...', VW / 2, y + h - 24, 18, '#f7cfd6', 'center');
}
function drawParadeHud(){
  const S = G.S, Pd = S.parade;
  outlined('Gilbert Days Parade', VW / 2, 50, 44, '#f7cfd6');
  txt('Swipe left or right on your phone to throw flowers to the crowd', VW / 2, 92, 20, '#fff', 'center');
  outlined(S.cheers + ' cheers', VW / 2, 140, 40, '#f2c531');
  txt(Math.max(0, Math.ceil(Pd.dur - Pd.t)) + 's', VW - 40, 50, 30, '#fff', 'right');
}

/* ---------------- sound ---------------- */
/* All of it is snd.js (Family Beatdown's engine, Watson's songs and
   effects). A browser keeps a page silent until somebody touches that
   device, so the TV shows a pill until it has had a tap or a key. */
let engines = [];
function soundOn(){ WSound.unlock(); setTimeout(() => WSound.kick(), 50); }
function toggleMute(){ WSound.mute(!WSound.muted()); }
const SFX_NAME = {whoosh: 'near', fuse: 'powder', goon: 'gooned', mist: 'water'};
function sfx(k, v){ WSound.fx(SFX_NAME[k] || k, v); }
function cue(k){ WSound.fx(k); }
let musicPhase = 'lobby';
function musicMode(m){ musicPhase = m; }
function musicTick(){
  const S = G.S;
  let want = 'mainstreet';
  if(G.phase === 'day' || G.phase === 'count') want = S.dust > 0.25 ? 'haboob' : 'rush';
  else if(G.phase === 'end' || G.phase === 'results') want = 'closing';
  else if(G.phase === 'parade') want = 'parade';
  if(G.paused) want = null;
  WSound.music(want);
}
/* the engine: one hum, for whichever van the action cam is on */
function engineTick(){
  const a = WSound.ctx(); if(!a || a.state !== 'running') return;
  const S = G.S, v = S.vans[featured()];
  let e = engines[0];
  if(!e){
    const o = a.createOscillator(), o2 = a.createOscillator(), f = a.createBiquadFilter(), g = a.createGain();
    o.type = 'sawtooth'; o2.type = 'square'; o2.detune.value = 7; f.type = 'lowpass'; f.frequency.value = 600; g.gain.value = 0;
    o.connect(f); o2.connect(f); f.connect(g); g.connect(WSound.out()); o.start(); o2.start();
    e = engines[0] = {o, o2, f, g};
  }
  const on = (G.phase === 'day' || G.phase === 'count') && v && !v.crash && !WSound.muted();
  const t = a.currentTime, spd = v ? v.spd : 0;
  const base = 38 + spd * 2.4 + (v && v.boosting ? 35 : 0);
  e.o.frequency.setTargetAtTime(base, t, 0.05); e.o2.frequency.setTargetAtTime(base * 0.5, t, 0.05);
  e.f.frequency.setTargetAtTime(400 + spd * 30, t, 0.05);
  e.g.gain.setTargetAtTime(on ? 0.02 + (v.boosting ? 0.015 : 0) : 0, t, 0.08);
}
function drawSoundPill(){
  if(WSound.on()) return;
  const t = '🔊  Tap this screen (or press a key) for music and sound';
  H.font = 'bold 18px system-ui'; const w = H.measureText(t).width + 40;
  H.fillStyle = 'rgba(242,197,49,' + (0.85 + 0.15 * Math.sin(wallT * 4)) + ')'; const py = VH - 56;
  roundRect(H, VW / 2 - w / 2, py, w, 40, 20); H.fill();
  txt(t, VW / 2, py + 20, 18, '#2a1418', 'center');
}

/* ---------------- go ---------------- */
resize();
setInterval(() => { engineTick(); musicTick(); }, 100);
rebuildVans();
requestAnimationFrame(frame);
// for netcheck and the curious
window.WTV = {G, NET, get M(){ return M; }, startDay, startParade, toLobby, scene, renderer, get V(){ return V; }, setMap};
</script>
